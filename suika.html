<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0e0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="골디게임">
<title>냥탑</title>
<style>
  :root{
    --bg:#0f0a14; --jar:#1a1220; --line:rgba(255,255,255,.09);
    --text:#f3ecf5; --muted:#a898b0; --faint:#6f6278;
    --accent:#ffc94d; --accent2:#ff7a9c;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,
      "Segoe UI",system-ui,sans-serif;
    background:radial-gradient(700px 500px at 50% -8%,#3a1f2e 0%,transparent 60%),var(--bg);
    color:var(--text); min-height:100vh; padding:16px 14px 30px;
    display:flex; flex-direction:column; align-items:center;
    user-select:none; -webkit-user-select:none;
  }
  .back{align-self:flex-start; color:var(--muted); text-decoration:none; font-size:14px}
  .back:hover{color:var(--text)}
  h1{font-size:27px; font-weight:900; letter-spacing:-.03em; margin:8px 0 2px;
    background:linear-gradient(104deg,#fff,#ffd97a 55%,#ff9ec8);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .sub{color:var(--faint); font-size:12px; margin-bottom:12px}

  .themes{display:flex; gap:6px; margin-bottom:11px}
  .themes button{background:var(--jar); color:var(--muted); border:1px solid var(--line);
    border-radius:99px; padding:6px 15px; font-size:12.5px; font-weight:700; cursor:pointer;
    transition:all .18s}
  .themes button.on{background:var(--accent); color:#2a1500; border-color:var(--accent)}
  .hud{width:100%; max-width:380px; display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .score{flex:1; background:var(--jar); border:1px solid var(--line); border-radius:13px;
    padding:8px 13px}
  .score .k{font-size:10px; color:var(--faint); letter-spacing:.1em; text-transform:uppercase}
  .score .v{font-size:22px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1.15}
  .nextBox{background:var(--jar); border:1px solid var(--line); border-radius:13px;
    padding:8px 10px; display:flex; flex-direction:column; align-items:center; gap:3px}
  .nextBox .k{font-size:10px; color:var(--faint)}

  .stage{position:relative; width:100%; max-width:380px}
  canvas{display:block; width:100%; height:auto; background:var(--jar);
    border:1px solid var(--line); border-radius:16px; touch-action:none; cursor:pointer}

  .screen{position:absolute; inset:0; border-radius:16px; z-index:5;
    background:rgba(15,10,20,.90); backdrop-filter:blur(6px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:13px; padding:22px; text-align:center}
  .screen.hide{display:none}
  .screen h2{font-size:26px; font-weight:900}
  .screen p{color:var(--muted); font-size:13.5px; line-height:1.6}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#2a1500;
    border:none; border-radius:13px; padding:13px 32px; font-weight:900; font-size:16px;
    cursor:pointer}
  .btn:active{transform:scale(.97)}

  /* the fruit ladder, so you can see what's coming */
  .ladder{width:100%; max-width:380px; margin-top:12px; display:flex; flex-wrap:wrap;
    gap:5px 7px; justify-content:center; align-items:center}
  .ladder .f{display:flex; align-items:center; gap:4px; font-size:10.5px; color:var(--faint)}
  .ladder .dot{border-radius:50%; display:block}
  .ladder .arw{color:#463c4d; font-size:9px}
  .hint{color:var(--faint); font-size:11.5px; margin-top:12px; text-align:center; line-height:1.7}
  kbd{background:var(--jar); border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; font-size:10.5px; font-weight:700}

  @media (max-width:640px){
    /* size the jar by height so the ladder and hint still fit under it */
    .stage{width:fit-content; max-width:100%; margin:0 auto}
    #cv{height:min(57vh, 540px); width:auto; max-width:100%}
    body{padding:12px 12px 16px}
    h1{font-size:23px; margin:6px 0 1px}
    .sub{font-size:11px; margin-bottom:9px}
    .hud{margin-bottom:8px}
    .score{padding:6px 11px}
    .score .v{font-size:19px}
    .ladder{margin-top:8px; gap:3px 5px}
    .ladder .f{font-size:9.5px}
    .hint{margin-top:8px; font-size:11px}
  }
  @media (max-height:560px) and (orientation:landscape){
    body{flex-direction:row; align-items:center; justify-content:center; gap:14px; padding:8px}
    h1,.sub,.hint,.ladder{display:none}
    .back{position:absolute; top:6px; left:10px; font-size:12px}
    .stage{max-width:none; height:calc(100vh - 20px); width:auto}
    canvas{height:100%; width:auto}
    .hud{flex-direction:column; width:auto; max-width:none; margin:0}
  }
</style>
</head>
<body>
<a class="back" href="index.html">← 골디 게임</a>
<h1 id="title">🐱 냥탑</h1>
<div class="sub" id="sub">같은 것끼리 합쳐 탑을 쌓으세요</div>
<div class="themes" id="themes"></div>

<div class="hud">
  <div class="score"><div class="k">점수</div><div class="v" id="score">0</div></div>
  <div class="score"><div class="k">최고</div><div class="v" id="best">0</div></div>
  <div class="nextBox"><div class="k">다음</div><canvas id="next" width="52" height="52"></canvas></div>
</div>

<div class="stage">
  <canvas id="cv" width="380" height="540"></canvas>
  <div class="screen" id="startScreen">
    <h2 id="startTitle">🐱 황금냥</h2>
    <p id="startBlurb"></p>
    <button class="btn" id="startBtn">시작</button>
  </div>
  <div class="screen hide" id="overScreen">
    <h2 id="overTitle">가득 찼어요!</h2>
    <p id="overText"></p>
    <button class="btn" id="retryBtn">다시 하기</button>
  </div>
</div>

<div class="ladder" id="ladder"></div>
<p class="hint">
  손가락으로 <b>좌우로 움직이고 떼면</b> 떨어져요 · 컴퓨터는 <kbd>←</kbd><kbd>→</kbd> 이동, <kbd>Space</kbd> 놓기
</p>

<script>
const cv=document.getElementById('cv'), cx=cv.getContext('2d');
const nx=document.getElementById('next'), nctx=nx.getContext('2d');
const $=s=>document.querySelector(s);
const W=cv.width, H=cv.height;

/* ---------------- themes ----------------
   The ladder is data, and each theme brings its own draw function, so the
   whole game can be re-skinned by switching one key. Radii and scores are
   shared: they are what the physics and the difficulty curve are tuned to. */
const SIZES  = [12, 16, 21, 27, 34, 42, 51, 61, 72, 85, 100];
const SCORES = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 100];

const THEMES = {
  cat: {
    label:'고양이', icon:'🐱', title:'황금냥', goalWord:'황금냥',
    blurb:'고양이를 떨어뜨려 같은 냥끼리 합치세요.',
    names:['아기냥','턱시도','치즈냥','삼색이','고등어','회색냥','페르시안','샴','숲냥','호랑이','황금냥'],
    cols:[['#f6d7e4','#dba9c2'], ['#5a5f72','#2f3342'], ['#ffc46b','#e09327'],
          ['#f4e3c8','#c98f5e'], ['#8fa0bb','#5b6b86'], ['#b9bdc9','#8a8f9e'],
          ['#f3ece0','#cdbfa8'], ['#e8dcc6','#9c7b5c'], ['#c78f5c','#8a5c34'],
          ['#f2a13c','#c2701a'], ['#ffd75e','#e0a017']],
    draw: drawCat,
  },
  planet: {
    label:'행성', icon:'🪐', title:'태양', goalWord:'태양',
    blurb:'행성을 떨어뜨려 같은 것끼리 합치세요.',
    names:['운석','달','수성','금성','지구','화성','천왕성','해왕성','토성','목성','태양'],
    cols:[['#9a938c','#5f5a55'], ['#dcd8d0','#a09a92'], ['#b8a58f','#7d6e5d'],
          ['#e8c37a','#b8904a'], ['#5aa0e0','#2c5f9e'], ['#e0724a','#a3452a'],
          ['#8fd8e0','#4f9aa8'], ['#5a78d8','#31479c'], ['#e0c98f','#a8905a'],
          ['#d9a878','#9c6f45'], ['#ffd75e','#f08c1a']],
    draw: drawPlanet,
  },
};
let themeKey = localStorage.getItem('suika_theme') || 'cat';
if(!THEMES[themeKey]) themeKey = 'cat';
let FRUITS = [];
function buildLadder(){
  const th = THEMES[themeKey];
  FRUITS = SIZES.map((r,i)=>({
    n: th.names[i], r, score: SCORES[i],
    c: th.cols[i][0], c2: th.cols[i][1],
    gold: i===SIZES.length-1,
  }));
}
buildLadder();
const DROPPABLE = 5;              // only the five smallest ever fall from the top
const TOP = 74;                   // spawn line
const DEAD = 108;                 // pile above this for a while = game over

/* ---------------- physics ----------------
   Impulse-based circles: integrate, then relax overlaps a few times per step.
   Several substeps keep a tall pile from jittering itself apart.            */
// Restitution and drag are what make this feel alive AND what make placement
// matter. At 0.12/0.986 pieces packed perfectly flat, which meant same-tier
// neighbours found each other on their own — random play scored as well as
// careful play. Letting them bounce leaves gaps and uneven ground, so where
// you drop actually decides something.
const GRAV=2100, REST=0.26, FRICT=0.9965, SUB=4, ITER=4;
let bodies=[], seq=0;

function addBody(x,y,type,vx=0,vy=0){
  const f=FRUITS[type];
  bodies.push({id:++seq, x, y, vx, vy, r:f.r, type, rot:Math.random()*6.3, vrot:0,
               age:0, pop:0, merged:false});
  return bodies[bodies.length-1];
}
function stepPhysics(dt){
  const h=dt/SUB;
  for(const b of bodies){ b._px=b.x; b._py=b.y; }
  for(let s=0;s<SUB;s++){
    for(const b of bodies){
      b.vy += GRAV*h;
      b.x += b.vx*h; b.y += b.vy*h;
      b.vx *= FRICT; b.vy *= FRICT;
      b.rot += b.vrot*h; b.vrot *= 0.94;
      b.age += h;
    }
    for(let it=0; it<ITER; it++){
      // walls and floor
      for(const b of bodies){
        // walls and floor impart spin only on a genuine impact, for the same
        // reason as the pair contacts above
        if(b.x-b.r < 0){ b.x=b.r; if(b.vx<0){ if(-b.vx>55) b.vrot += b.vy*0.004; b.vx=-b.vx*REST; } }
        if(b.x+b.r > W){ b.x=W-b.r; if(b.vx>0){ if(b.vx>55) b.vrot -= b.vy*0.004; b.vx=-b.vx*REST; } }
        if(b.y+b.r > H){ b.y=H-b.r; if(b.vy>0){ if(b.vy>55) b.vrot=b.vx*0.02; b.vy=-b.vy*REST; b.vx*=0.90; } }
      }
      // pairs
      for(let i=0;i<bodies.length;i++){
        const a=bodies[i];
        for(let j=i+1;j<bodies.length;j++){
          const b=bodies[j];
          let dx=b.x-a.x, dy=b.y-a.y;
          const rr=a.r+b.r;
          let d2=dx*dx+dy*dy;
          if(d2 >= rr*rr || d2===0) continue;
          let d=Math.sqrt(d2);
          const nxv=dx/d, nyv=dy/d, pen=rr-d;
          // heavier fruit moves less
          const ma=a.r*a.r, mb=b.r*b.r, tot=ma+mb;
          const pa=pen*(mb/tot), pb=pen*(ma/tot);
          a.x-=nxv*pa; a.y-=nyv*pa;
          b.x+=nxv*pb; b.y+=nyv*pb;
          // bounce along the contact normal
          const rvx=b.vx-a.vx, rvy=b.vy-a.vy;
          const vn=rvx*nxv+rvy*nyv;
          if(vn<0){
            const imp=-(1+REST)*vn/(1/ma+1/mb);
            a.vx-=imp*nxv/ma; a.vy-=imp*nyv/ma;
            b.vx+=imp*nxv/mb; b.vy+=imp*nyv/mb;
            // Only a real impact should impart spin. Resting neighbours still
            // carry the phantom gravity velocity, and without this gate they
            // fed each other spin 16x a frame — faster than damping removed it,
            // so settled pieces rotated on the spot forever. Position never
            // showed it because positional correction pins that; nothing pins
            // the angle.
            if(-vn > 55){
              const spin=(rvx*-nyv+rvy*nxv)*0.02;
              a.vrot-=spin; b.vrot+=spin;
            }
          }
          // Rolling. Sliding along a contact should turn the piece, which is
          // what selling "it tumbled off" depends on. Blend toward rolling
          // without slipping (w = v_t / r) rather than setting it outright, so
          // a resting stack doesn't twitch.
          // The threshold must clear the phantom velocity a parked body carries,
          // or resting pieces get "rolled" by their own noise — that is what put
          // the spin-in-place back. Parked pieces are skipped outright.
          const vt = (b.vx-a.vx)*-nyv + (b.vy-a.vy)*nxv;
          if(Math.abs(vt) > 60){
            if((a.rest||0) < 0.3) a.vrot += (-vt/a.r - a.vrot)*0.12;
            if((b.rest||0) < 0.3) b.vrot += ( vt/b.r - b.vrot)*0.12;
          }
        }
      }
    }
  }
  // A resting body keeps collecting gravity every substep while its contact
  // never pushes back (approach speed is ~0, so no impulse fires). Position
  // stays put but velocity creeps up, which made "is it settled?" unanswerable
  // from velocity alone. Judge rest by how far it actually moved, and bleed
  // off that phantom energy so piles genuinely go quiet.
  for(const b of bodies){
    b.moved = Math.hypot(b.x-b._px, b.y-b._py);
    // This threshold decides what counts as "not moving". Set too high it eats
    // slow slides: a piece starting to roll off a shoulder creeps a few px per
    // frame, got read as settled, and was damped to a stop mid-slide — which is
    // why nothing ever tumbled. Only genuinely parked pieces get damped now.
    if(b.moved < 0.12){
      b.rest = (b.rest||0) + dt;
      if(b.rest > 0.5){ b.vx*=0.85; b.vy*=0.85; b.vrot = 0; }
    } else b.rest = 0;
  }
}
/* merge any touching same-type pair; chains happen naturally next frame */
function resolveMerges(){
  for(let i=0;i<bodies.length;i++){
    const a=bodies[i]; if(a.merged) continue;
    for(let j=i+1;j<bodies.length;j++){
      const b=bodies[j]; if(b.merged || b.type!==a.type) continue;
      const dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r;
      if(dx*dx+dy*dy > rr*rr*1.02) continue;
      a.merged=b.merged=true;
      const t=a.type;
      // Merges that land close together count as one chain. A cascade is the
      // one thing here that placement actually earns, so it is worth paying for.
      chain = (chainTimer > 0) ? chain+1 : 1;
      chainTimer = 0.55;
      const mult = CHAIN_MULT[Math.min(chain, CHAIN_MULT.length)-1];
      if(chain >= 2){
        chainBest = Math.max(chainBest, chain);
        chainFlash = 1;
        // A cascade fires many merges at once; a popup for each buries the
        // board. Only call out milestones, and keep at most a few on screen —
        // the running counter in the corner covers the rest.
        if(chain===3 || chain===5 || chain>=7){
          if(texts.length < 4)
            texts.push({x:(a.x+b.x)/2, y:(a.y+b.y)/2-24,
                        s:chain+'연쇄 ×'+mult, life:.9, vy:-52, col:'#ffd34d'});
        }
      }
      if(t < FRUITS.length-1){
        const nb=addBody((a.x+b.x)/2, (a.y+b.y)/2, t+1,
                         (a.vx+b.vx)/2, (a.vy+b.vy)/2);
        nb.pop=1;
        score += Math.round(FRUITS[t+1].score * mult);
        if(t+1===FRUITS.length-1 && !madeGold){ madeGold=true; goldFlash=1; fanfare(); }
        burst(nb.x, nb.y, FRUITS[t+1], nb.r);
        pling(t+1);
      } else {
        // two of the final tier cancel out — a big bonus and space back
        score += Math.round(500*mult); burst(a.x,a.y,FRUITS[t],a.r*1.3); fanfare();
      }
      break;
    }
  }
  if(bodies.some(b=>b.merged)) bodies = bodies.filter(b=>!b.merged);
}

/* ---------------- audio ---------------- */
let ac=null;
function actx(){
  if(!ac){ const A=window.AudioContext||window.webkitAudioContext; if(!A) return null; ac=new A(); }
  if(ac.state==='suspended') ac.resume();
  return ac;
}
const midi=m=>440*Math.pow(2,(m-69)/12);
function pling(level){
  const a=actx(); if(!a) return;
  const t=a.currentTime;
  // bigger fruit, lower and rounder note
  const m = 84 - level*3;
  [[0,'triangle',0.16],[12,'sine',0.07]].forEach(([off,type,vol])=>{
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=midi(m+off);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.36);
  });
}
function thud(strength){
  const a=actx(); if(!a) return;
  const t=a.currentTime, v=Math.min(0.14, 0.03+strength*0.00012);
  const o=a.createOscillator(), g=a.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(60,t+0.10);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.16);
}
function fanfare(){
  const a=actx(); if(!a) return;
  [0,4,7,12].forEach((s,i)=>{
    const t=a.currentTime+i*0.09;
    const o=a.createOscillator(), g=a.createGain();
    o.type='triangle'; o.frequency.value=midi(72+s);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.18,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.44);
  });
}
function silence(){ if(ac){ try{ac.close();}catch(e){} ac=null; } }

/* ---------------- scoring extras ----------------
   Two things reward playing well rather than merely playing long: cascades
   set off by one drop, and how many pieces you survive. */
// Kept deliberately modest. At up to 8x a single lucky cascade outweighed a
// whole game of careful play — measured best and random play scoring dead
// level. A chain should feel good, not decide the match.
const CHAIN_MULT=[1, 1.25, 1.5, 1.8, 2.1, 2.5];
const SURVIVE_STEP=25;                       // a bonus every N pieces dropped
let chain=0, chainTimer=0, chainBest=0, chainFlash=0;
let dropped=0, nextMilestone=SURVIVE_STEP;
let texts=[];

/* ---------------- particles ---------------- */
let parts=[], goldFlash=0;
function burst(x,y,f,r){
  const n=Math.min(26, 8+Math.round(r/4));
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, sp=40+Math.random()*160;
    parts.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40,
                life:1, size:2+Math.random()*(r*0.10), c: Math.random()<0.5?f.c:f.c2});
  }
}

/* ---------------- game state ---------------- */
const bestKey = ()=> 'suika_best_'+themeKey;

// 최고점은 판이 끝났을 때만 적는다. 노는 도중에 적으면 바깥 앱이 그걸
// 5초마다 읽어다 올려서, 한 판에 순위 알림이 몇 번씩 울린다.
//
// 순위표에는 테마와 상관없이 하나로 올린다. 고양이든 행성이든 크기와
// 점수표가 똑같아서 같은 조건이다. 테마별 기록은 게임 안에서만 쓴다.
window.saveBest = function(){
  try{
    if(score > best) best = score;
    if(best > 0) localStorage.setItem(bestKey(), best);
    const all = Math.max(
      +(localStorage.getItem('suika_best_cat')||0),
      +(localStorage.getItem('suika_best_planet')||0));
    if(all > 0) localStorage.setItem('suika_best', all);
  }catch(e){}
};
addEventListener('pagehide', window.saveBest);
let score=0, best=+(localStorage.getItem(bestKey())||0);
let cursor=W/2, current=null, nextType=0, dropLock=0;
let playing=false, over=false, madeGold=false, overTimer=0, raf=null, lastT=0;
$('#best').textContent=best;

// 다음에 뭐가 나올지 — 가방에서 꺼낸다.
//
// 그냥 무작위로 뽑으면 필요한 고양이를 마흔 번 넘게 못 보기도 하고,
// 같은 게 다섯 번 연달아 나오기도 한다. 그러면 계획을 세울 수가 없어서
// "대중이 없다"는 느낌이 든다. 캣트리스가 조각을 가방에서 꺼내는 것과
// 같은 방식으로, 다섯 종류가 고르게 돌아오게 한다.
let typeBag = [];
function refillBag(){
  // 다섯 종류를 두 개씩 넣고 섞는다. 한 바퀴 안에 반드시 다 나온다.
  typeBag = [];
  for(let k=0;k<DROPPABLE;k++){ typeBag.push(k, k); }
  for(let i=typeBag.length-1;i>0;i--){
    const j=(Math.random()*(i+1))|0; [typeBag[i],typeBag[j]]=[typeBag[j],typeBag[i]];
  }
}
let lastRolled = -1, sameRun = 0;
function rollType(){
  if(!typeBag.length) refillBag();
  let t = typeBag.pop();
  // 같은 게 세 번 넘게 이어지면 가방 속 다른 것과 바꾼다
  if(t === lastRolled && sameRun >= 2 && typeBag.length){
    const k = typeBag.findIndex(v => v !== t);
    if(k >= 0){ const tmp = typeBag[k]; typeBag[k] = t; t = tmp; }
  }
  sameRun = (t === lastRolled) ? sameRun + 1 : 0;
  lastRolled = t;
  return t;
}
function newGame(){
  bodies=[]; parts=[]; texts=[]; score=0; over=false; madeGold=false; overTimer=0;
  goldFlash=0; dropLock=0; cursor=W/2;
  chain=0; chainTimer=0; chainBest=0; chainFlash=0;
  dropped=0; nextMilestone=SURVIVE_STEP;
  current=rollType(); nextType=rollType();
  playing=true;
  $('#score').textContent=0;
  $('#startScreen').classList.add('hide');
  $('#overScreen').classList.add('hide');
  drawNext();
  lastT=0;
  if(!raf) raf=requestAnimationFrame(loop);
}
function drop(){
  if(!playing || over || current===null || dropLock>0) return;
  const f=FRUITS[current];
  const x=Math.max(f.r+2, Math.min(W-f.r-2, cursor));
  const b=addBody(x, TOP, current, 0, 60);
  b.age=0;
  dropped++;
  // surviving is worth more the longer it goes on
  if(dropped >= nextMilestone){
    const step = nextMilestone/SURVIVE_STEP;
    const bonus = 50*step;
    score += bonus;
    texts.push({x:W/2, y:H*0.34, s:dropped+'개 돌파 +'+bonus, life:1.3, vy:-30, col:'#8fd66a'});
    nextMilestone += SURVIVE_STEP;
  }
  current=nextType; nextType=rollType();
  dropLock=0.34;
  drawNext();
  thud(60);
}

/* ---------------- drawing ---------------- */
/* ---------------- drawing ----------------
   Every theme gets the same call: a circle of radius r at (x,y), rolled by
   rot. Details are dropped as the piece gets small, so a 12px baby cat stays
   readable instead of turning into mud. */
function ball(ctx,r,c,c2){
  const g=ctx.createRadialGradient(-r*0.32,-r*0.36,r*0.08, 0,0,r);
  g.addColorStop(0,c); g.addColorStop(1,c2);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(0,0,r,0,6.284); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.20)'; ctx.lineWidth=Math.max(1,r*0.045);
  ctx.beginPath(); ctx.arc(0,0,r-ctx.lineWidth/2,0,6.284); ctx.stroke();
}
function drawCat(ctx,x,y,r,f,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  // ears poke out behind the head
  ctx.fillStyle=f.c2;
  [[-1,1],[1,1]].forEach(([s])=>{
    ctx.beginPath();
    ctx.moveTo(s*r*0.80, -r*0.44);
    ctx.lineTo(s*r*0.92, -r*1.06);
    ctx.lineTo(s*r*0.16, -r*0.80);
    ctx.closePath(); ctx.fill();
  });
  ball(ctx,r,f.c,f.c2);
  // inner ear
  if(r>=16){
    ctx.fillStyle='rgba(255,150,180,.55)';
    [[-1],[1]].forEach(([s])=>{
      ctx.beginPath();
      ctx.moveTo(s*r*0.70,-r*0.52); ctx.lineTo(s*r*0.78,-r*0.92); ctx.lineTo(s*r*0.32,-r*0.74);
      ctx.closePath(); ctx.fill();
    });
  }
  // face
  const eo=r*0.30, ey=-r*0.04, er=Math.max(1.2, r*0.11);
  ctx.fillStyle='rgba(28,22,34,.88)';
  ctx.beginPath(); ctx.ellipse(-eo,ey,er*0.85,er,0,0,6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse( eo,ey,er*0.85,er,0,0,6.284); ctx.fill();
  if(r>=14){
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(-eo+er*0.34, ey-er*0.36, er*0.32,0,6.284); ctx.fill();
    ctx.beginPath(); ctx.arc( eo+er*0.34, ey-er*0.36, er*0.32,0,6.284); ctx.fill();
  }
  if(r>=18){
    ctx.fillStyle='#ff7a9c';
    ctx.beginPath();
    ctx.moveTo(0,r*0.30); ctx.lineTo(-r*0.11,r*0.16); ctx.lineTo(r*0.11,r*0.16);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(28,22,34,.62)'; ctx.lineWidth=Math.max(1,r*0.035); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(0,r*0.30); ctx.lineTo(0,r*0.42);
    ctx.moveTo(0,r*0.42); ctx.quadraticCurveTo(-r*0.16,r*0.56,-r*0.26,r*0.38);
    ctx.moveTo(0,r*0.42); ctx.quadraticCurveTo( r*0.16,r*0.56, r*0.26,r*0.38);
    ctx.stroke();
  }
  if(r>=26){
    ctx.strokeStyle='rgba(255,255,255,.42)'; ctx.lineWidth=Math.max(1,r*0.03);
    ctx.beginPath();
    ctx.moveTo(-r*0.34,r*0.24); ctx.lineTo(-r*0.94,r*0.14);
    ctx.moveTo(-r*0.34,r*0.36); ctx.lineTo(-r*0.92,r*0.44);
    ctx.moveTo( r*0.34,r*0.24); ctx.lineTo( r*0.94,r*0.14);
    ctx.moveTo( r*0.34,r*0.36); ctx.lineTo( r*0.92,r*0.44);
    ctx.stroke();
  }
  // the goal cat wears a little crown
  if(f.gold && r>=30){
    ctx.fillStyle='#fff0a8';
    ctx.beginPath();
    ctx.moveTo(-r*0.34,-r*0.86); ctx.lineTo(-r*0.22,-r*1.16); ctx.lineTo(0,-r*0.92);
    ctx.lineTo(r*0.22,-r*1.16); ctx.lineTo(r*0.34,-r*0.86);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawPlanet(ctx,x,y,r,f,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  const ringed = f.n==='토성';
  if(ringed){
    ctx.save(); ctx.rotate(-0.42);
    ctx.strokeStyle='rgba(230,205,150,.75)'; ctx.lineWidth=Math.max(2,r*0.13);
    ctx.beginPath(); ctx.ellipse(0,0,r*1.55,r*0.42,0,0,6.284); ctx.stroke();
    ctx.restore();
  }
  ball(ctx,r,f.c,f.c2);
  // surface banding / craters, dropped when too small to read
  if(r>=22){
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,r-1,0,6.284); ctx.clip();
    ctx.globalAlpha=.30; ctx.fillStyle=f.c2;
    for(let i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.ellipse(0, i*r*0.36, r*1.1, r*0.13, 0, 0, 6.284); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.restore();
  }
  ctx.fillStyle='rgba(255,255,255,.30)';
  ctx.beginPath(); ctx.ellipse(-r*0.34,-r*0.40, r*0.26, r*0.17, -0.6, 0, 6.284); ctx.fill();
  // the sun burns rather than reflects
  if(f.gold){
    ctx.strokeStyle='rgba(255,220,120,.7)'; ctx.lineWidth=Math.max(1.5,r*0.05);
    for(let i=0;i<10;i++){
      const a=i/10*6.284;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*1.03, Math.sin(a)*r*1.03);
      ctx.lineTo(Math.cos(a)*r*1.20, Math.sin(a)*r*1.20);
      ctx.stroke();
    }
  }
  ctx.restore();
}
function fruitPath(ctx,x,y,r,f,rot){ THEMES[themeKey].draw(ctx,x,y,r,f,rot); }
function draw(){
  cx.clearRect(0,0,W,H);
  if(goldFlash>0){
    cx.fillStyle=`rgba(255,211,77,${goldFlash*0.30})`;
    cx.fillRect(0,0,W,H);
  }
  // danger line
  const danger = bodies.some(b=>b.age>0.6 && b.y-b.r < DEAD);
  cx.strokeStyle = danger ? 'rgba(255,110,140,'+(0.45+0.35*Math.sin(Date.now()/120))+')'
                          : 'rgba(255,255,255,.13)';
  cx.lineWidth=2; cx.setLineDash([7,7]);
  cx.beginPath(); cx.moveTo(0,DEAD); cx.lineTo(W,DEAD); cx.stroke();
  cx.setLineDash([]);

  for(const b of bodies){
    const f=FRUITS[b.type];
    let r=b.r;
    if(b.pop>0){ r = b.r*(1 + Math.sin(b.pop*Math.PI)*0.22); b.pop-=0.06; }
    fruitPath(cx, b.x, b.y, r, f, b.rot);
  }
  // 떨어뜨릴 자리에 매달린 냥.
  // 예전엔 아래로 안내선을 그었는데, 어디 떨어질지 다 알려 주면 눈대중으로
  // 맞히는 재미가 없어진다. 매달린 냥의 위치만 보고 가늠하게 뒀다.
  if(playing && !over && current!==null){
    const f=FRUITS[current];
    const x=Math.max(f.r+2, Math.min(W-f.r-2, cursor));
    cx.save();
    if(dropLock>0) cx.globalAlpha=0.45;
    fruitPath(cx, x, TOP, f.r, f, 0);
    cx.restore();
  }
  // particles
  parts.forEach(p=>{
    cx.globalAlpha=Math.max(0,p.life);
    cx.fillStyle=p.c;
    cx.beginPath(); cx.arc(p.x,p.y,p.size,0,6.284); cx.fill();
  });
  cx.globalAlpha=1;
  // floating score callouts
  texts.forEach(t=>{
    cx.save();
    cx.globalAlpha=Math.min(1,t.life*1.4);
    cx.font='900 17px "Pretendard","Apple SD Gothic Neo",system-ui,sans-serif';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.lineWidth=4; cx.strokeStyle='rgba(15,10,20,.85)';
    cx.strokeText(t.s, t.x, t.y);
    cx.fillStyle=t.col; cx.fillText(t.s, t.x, t.y);
    cx.restore();
  });
  // live chain indicator
  if(chain>=2 && chainTimer>0){
    cx.save();
    cx.globalAlpha=Math.min(1, chainTimer*2);
    cx.font='900 15px system-ui, sans-serif'; cx.textAlign='right';
    cx.fillStyle='#ffd34d';
    cx.fillText(chain+'연쇄!', W-12, 52);
    cx.restore();
  }
}
function drawNext(){
  nctx.clearRect(0,0,nx.width,nx.height);
  const f=FRUITS[nextType];
  const r=Math.min(20, f.r);
  fruitPath(nctx, nx.width/2, nx.height/2, r, f, 0);
}

/* ---------------- loop ---------------- */
function loop(ts){
  raf=requestAnimationFrame(loop);
  const dt=lastT ? Math.min(0.033,(ts-lastT)/1000) : 0.016;
  lastT=ts;
  if(playing && !over){
    if(dropLock>0) dropLock-=dt;
    stepPhysics(dt);
    resolveMerges();
    // Overflow is measured as time spent above the line, not stillness: a jar
    // packed to the brim keeps slowly rearranging and never reads as "at rest",
    // so a stillness test would let an overflowing pile play on forever. A
    // dropped fruit only passes through the zone for a few tenths of a second,
    // well under the limit.
    let worst = 0;
    for(const b of bodies){
      if(b.age > 0.5 && b.y - b.r < DEAD) b.overTime = (b.overTime||0) + dt;
      else b.overTime = 0;
      if(b.overTime > worst) worst = b.overTime;
    }
    overTimer = worst;
    if(worst > 2.0) gameOver();
    $('#score').textContent = score.toLocaleString();
  }
  parts.forEach(p=>{ p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*1.5; });
  if(parts.length) parts=parts.filter(p=>p.life>0);
  if(goldFlash>0) goldFlash=Math.max(0,goldFlash-dt*1.6);
  if(chainFlash>0) chainFlash=Math.max(0,chainFlash-dt*2);
  // a chain lapses once merges stop coming
  if(chainTimer>0){ chainTimer-=dt; if(chainTimer<=0) chain=0; }
  if(texts.length){
    texts.forEach(t=>{ t.y+=t.vy*dt; t.vy*=0.94; t.life-=dt*0.9; });
    texts=texts.filter(t=>t.life>0);
  }
  draw();
}
function gameOver(){
  over=true; playing=false;
  window.saveBest();
  $('#best').textContent = best;
  const biggest=bodies.reduce((m,b)=>Math.max(m,b.type),0);
  $('#overTitle').textContent = madeGold ? THEMES[themeKey].goalWord+' 달성! 🏆' : '가득 찼어요!';
  $('#overText').innerHTML =
    `점수 <b>${score.toLocaleString()}</b> · 최고 단계 <b>${FRUITS[biggest].n}</b><br>` +
    `버틴 개수 <b>${dropped}</b> · 최대 연쇄 <b>${chainBest||1}</b>` +
    (score>=best && score>0 ? '<br>🎉 최고 기록!' : '');
  $('#overScreen').classList.remove('hide');
}

/* ---------------- input ---------------- */
function xFromEvent(e){
  const r=cv.getBoundingClientRect();
  return (e.clientX-r.left)/r.width*W;
}
let aiming=false;
cv.addEventListener('pointerdown', e=>{
  if(!playing||over) return;
  e.preventDefault(); aiming=true; cursor=xFromEvent(e);
});
cv.addEventListener('pointermove', e=>{
  if(!playing||over) return;
  if(aiming || e.pointerType==='mouse') cursor=xFromEvent(e);
});
cv.addEventListener('pointerup', e=>{
  if(!playing||over) return;
  if(aiming){ cursor=xFromEvent(e); drop(); }
  aiming=false;
});
cv.addEventListener('pointercancel', ()=>{ aiming=false; });
addEventListener('keydown', e=>{
  if(!playing||over){
    if(e.code==='Space'||e.key==='Enter'){ e.preventDefault(); newGame(); }
    return;
  }
  const step=18;
  if(e.key==='ArrowLeft'||e.key==='a'){ cursor=Math.max(0,cursor-step); e.preventDefault(); }
  else if(e.key==='ArrowRight'||e.key==='d'){ cursor=Math.min(W,cursor+step); e.preventDefault(); }
  else if(e.code==='Space'||e.key==='ArrowDown'){ e.preventDefault(); drop(); }
});
$('#startBtn').onclick=newGame;
$('#retryBtn').onclick=newGame;
addEventListener('pagehide', silence);
addEventListener('beforeunload', silence);

/* ---- theme switcher ---- */
function applyTheme(){
  buildLadder();
  const th=THEMES[themeKey];
  // 이름은 '냥탑' 으로 고정. 테마가 바뀌어도 같은 게임이다.
  document.title = '냥탑';
  $('#title').textContent = th.icon+' 냥탑';
  $('#startTitle').textContent = th.icon+' 냥탑';
  $('#startBlurb').innerHTML = th.blurb+'<br>통 밖으로 넘치면 끝이에요.';
  best = +(localStorage.getItem(bestKey())||0);
  $('#best').textContent = best;
  document.querySelectorAll('#themes button').forEach(b=>
    b.classList.toggle('on', b.dataset.k===themeKey));
  renderLadder();
  drawNext(); draw();
}
(function(){
  const el=$('#themes');
  Object.entries(THEMES).forEach(([k,th])=>{
    const b=document.createElement('button');
    b.dataset.k=k; b.textContent=th.icon+' '+th.label;
    b.onclick=()=>{
      if(playing && !over && bodies.length){
        if(!confirm('테마를 바꾸면 지금 판은 끝나요. 바꿀까요?')) return;
      }
      themeKey=k; localStorage.setItem('suika_theme',k);
      bodies=[]; parts=[]; playing=false; over=false;
      $('#startScreen').classList.remove('hide');
      $('#overScreen').classList.add('hide');
      score=0; $('#score').textContent=0;
      current=rollType(); nextType=rollType();
      applyTheme();
    };
    el.appendChild(b);
  });
})();

/* ladder strip under the board */
function renderLadder(){
  const el=$('#ladder');
  el.innerHTML='';
  FRUITS.forEach((f,i)=>{
    if(i) { const s=document.createElement('span'); s.className='arw'; s.textContent='▸'; el.appendChild(s); }
    const d=document.createElement('span'); d.className='f';
    const dot=document.createElement('span'); dot.className='dot';
    const px=Math.round(7+i*1.1);
    dot.style.width=dot.style.height=px+'px';
    dot.style.background=f.c;
    d.appendChild(dot);
    const t=document.createElement('span'); t.textContent=f.n; d.appendChild(t);
    el.appendChild(d);
  });
}
current=rollType(); nextType=rollType();
applyTheme();
</script>
