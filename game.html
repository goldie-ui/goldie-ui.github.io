<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0e0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="골디게임">
<title>2048</title>
<style>
  :root{
    --bg:#0e0f1a; --board:#181a2b; --cell:#20233a; --text:#e8e9f3; --muted:#9aa0c0;
    --accent:#7c6cff; --accent2:#ff6ca8; --line:rgba(255,255,255,.08);
  }
  /* 폰에서 빠르게 두 번 누르면 화면이 확대되고, 그러면서 글자가 잡혀
     '복사하기' 딱지가 떴다. 게임 화면에서 글자를 집을 일은 없으니
     아예 못 잡게 하고, 두 번 눌러 확대하는 것도 막는다.
     touch-action:manipulation 이 두 번 누르기 확대를 없애는 열쇠다. */
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none; user-select:none; -webkit-user-select:none}
  html,body{touch-action:manipulation; overscroll-behavior:none}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background:radial-gradient(900px 600px at 50% -10%,#241a3d 0%,transparent 55%),var(--bg);
    color:var(--text); min-height:100vh; padding:26px 16px 50px;
    display:flex; flex-direction:column; align-items:center}
  .back{align-self:flex-start; color:var(--muted); text-decoration:none; font-size:14px}
  .back:hover{color:var(--text)}
  .top{width:100%; max-width:440px; display:flex; justify-content:space-between;
    align-items:flex-end; margin:16px 0 18px}
  h1{font-size:44px; font-weight:900; letter-spacing:-2px;
    background:linear-gradient(120deg,#fff,#b9b0ff,#ff9ec8);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .scores{display:flex; gap:10px}
  .score{background:var(--board); border:1px solid var(--line); border-radius:12px;
    padding:8px 16px; text-align:center; min-width:78px}
  .score .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px}
  .score .val{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums}
  .bar{width:100%; max-width:440px; display:flex; justify-content:space-between;
    align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  .bar p{color:var(--muted); font-size:14px}
  .bar .actions{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto}
  .bar button{background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:10px 16px; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap;
    transition:filter .2s,opacity .2s}
  .bar button:hover{filter:brightness(1.1)}
  .bar button.ghost{background:#20233a; border:1px solid var(--line); color:var(--text)}
  .bar button:disabled{opacity:.4; cursor:default; filter:none}
  .board-wrap{position:relative; width:100%; max-width:440px}
  .board{position:relative; background:var(--board); border-radius:18px; padding:12px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px; touch-action:none;
    aspect-ratio:1}
  .bg-cell{background:var(--cell); border-radius:12px}
  .tiles{position:absolute; inset:12px}
  /* 자리는 --x/--y 로 잡는다. 애니메이션이 transform 을 통째로 덮어쓰기
     때문에, 자리를 transform 안에 직접 적으면 튀어오르는 순간 타일이
     왼쪽 위 구석으로 날아갔다 돌아온다. 변수로 빼 두면 keyframes 안에서도
     같은 자리를 유지할 수 있다. */
  .tile{position:absolute; display:flex; align-items:center; justify-content:center;
    border-radius:12px; font-weight:800; font-variant-numeric:tabular-nums;
    transform:translate(var(--x,0px),var(--y,0px));
    transition:transform .13s ease, opacity .13s; will-change:transform}
  .tile.pop{animation:pop .19s cubic-bezier(.3,1.5,.5,1)}
  .tile.spawn{animation:spawn .18s cubic-bezier(.3,1.6,.5,1)}
  .tile.big{animation:bigpop .34s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{
    0%{transform:translate(var(--x,0px),var(--y,0px)) scale(1)}
    45%{transform:translate(var(--x,0px),var(--y,0px)) scale(1.2)}
    100%{transform:translate(var(--x,0px),var(--y,0px)) scale(1)}}
  @keyframes spawn{
    0%{transform:translate(var(--x,0px),var(--y,0px)) scale(0)}
    100%{transform:translate(var(--x,0px),var(--y,0px)) scale(1)}}
  /* 큰 수가 나왔을 때. 한 번 더 크게 부풀고 빛이 돈다. */
  @keyframes bigpop{
    0%{transform:translate(var(--x,0px),var(--y,0px)) scale(1); filter:brightness(1)}
    35%{transform:translate(var(--x,0px),var(--y,0px)) scale(1.38); filter:brightness(1.9)}
    100%{transform:translate(var(--x,0px),var(--y,0px)) scale(1); filter:brightness(1)}}

  /* 합쳐진 자리에서 떠오르는 점수, 판 한가운데 뜨는 연쇄·콤보 문구 */
  /* overflow 를 막지 않는다. 맨 윗줄에서 합쳐진 점수가 위로 떠오를 때
     판 밖으로 나가는데, 가둬 두면 그게 잘려 보인다. */
  .fx{position:absolute; inset:12px; pointer-events:none; z-index:4}
  .pt{position:absolute; font-weight:900; font-variant-numeric:tabular-nums;
    color:#fff; animation:rise .85s ease-out forwards; white-space:nowrap;
    -webkit-text-stroke:3px rgba(14,15,26,.75); paint-order:stroke fill}
  @keyframes rise{
    0%{opacity:0; transform:translate(-50%,6px) scale(.7)}
    18%{opacity:1; transform:translate(-50%,-6px) scale(1.15)}
    100%{opacity:0; transform:translate(-50%,-46px) scale(1)}}
  .banner{position:absolute; left:50%; top:34%; font-weight:900; white-space:nowrap;
    -webkit-text-stroke:4px rgba(14,15,26,.7); paint-order:stroke fill;
    animation:bann .9s ease-out forwards}
  @keyframes bann{
    0%{opacity:0; transform:translate(-50%,10px) scale(.6)}
    20%{opacity:1; transform:translate(-50%,0) scale(1.15)}
    75%{opacity:1; transform:translate(-50%,-6px) scale(1)}
    100%{opacity:0; transform:translate(-50%,-22px) scale(1)}}

  /* 크게 터졌을 때 판 테두리가 번쩍이고 살짝 흔들린다 */
  .board.flash::after{content:''; position:absolute; inset:0; border-radius:18px;
    border:4px solid #ffd633; box-shadow:0 0 26px rgba(255,214,51,.65) inset;
    pointer-events:none; z-index:4; animation:flash .55s ease-out forwards}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}
  .board.shake{animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translate(0,0)} 25%{transform:translate(-5px,3px)}
    50%{transform:translate(4px,-3px)} 75%{transform:translate(-3px,-2px)}}
  .overlay{position:absolute; inset:0; background:rgba(14,15,26,.82); border-radius:18px;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    z-index:5}
  .overlay.show{display:flex}
  .overlay h2{font-size:38px; font-weight:900}
  .overlay button{background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff;
    border:none; border-radius:12px; padding:13px 28px; font-weight:700; font-size:16px; cursor:pointer}
  .hint{color:var(--muted); font-size:13px; margin-top:18px; text-align:center}

  /* 지금 1등을 쫓는 띠.
     앱에서 게임을 켜면 순위표 1등이 localStorage 로 넘어온다. 혼자 파일만
     열었을 때는 넘어올 게 없어서 이 띠가 아예 안 나온다.
     1등 점수는 못박아 둔다 — 남은 점수를 세면 숫자가 줄면서 쫓기는
     기분이 드는데, 목표를 걸어 두고 올라가는 편이 낫다. */
  .chase{width:100%; max-width:440px; display:flex; align-items:center; gap:9px;
    margin:0 auto 12px; font-size:11.5px; color:#ff9fbb}
  .chase.hide{display:none}
  .chase .who{font-weight:700; white-space:nowrap; max-width:34%;
    overflow:hidden; text-overflow:ellipsis}
  .chase .bar{flex:1; height:5px; border-radius:99px;
    background:rgba(255,255,255,.10); overflow:hidden}
  .chase .bar i{display:block; height:100%; width:0;
    background:linear-gradient(90deg,#ff8fb0,#ffd85b); transition:width .35s ease}
  .chase .val{font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap}
  .chase.won{color:#ffd85b}
  .chase.won .bar i{background:#ffd85b; animation:chasePulse 1.1s ease-in-out infinite}
  @keyframes chasePulse{50%{opacity:.4}}
</style>
</head>
<body>
<a class="back" href="index.html">← 골디 게임</a>
<div class="top">
  <h1>2048</h1>
  <div class="scores">
    <div class="score"><div class="lbl">점수</div><div class="val" id="score">0</div></div>
    <div class="score"><div class="lbl">최고</div><div class="val" id="best">0</div></div>
  </div>
</div>
<div class="chase hide" id="chase">
  <span class="who" id="chaseWho">1등</span>
  <span class="bar"><i id="chaseFill"></i></span>
  <span class="val" id="chaseVal">0</span>
</div>

<div class="bar">
  <p>같은 숫자를 합쳐 <b>2048</b>을 만드세요</p>
  <div class="actions">
    <button id="undo" class="ghost" disabled>↩ 되돌리기</button>
    <button id="redo" class="ghost" disabled>다시하기 ↪</button>
    <button id="newGame">새 게임</button>
  </div>
</div>
<div class="board-wrap">
  <div class="board" id="board">
    <div class="tiles" id="tiles"></div>
    <div class="fx" id="fx"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlayText">게임 오버</h2>
      <button id="retry">다시 하기</button>
    </div>
  </div>
</div>
<p class="hint">화살표 키 · WASD · 화면 스와이프로 이동 &nbsp;·&nbsp; Z 되돌리기 · Y 다시하기</p>

<script>
const N = 4;
const boardEl = document.getElementById('board');
const tilesEl = document.getElementById('tiles');
const colors = {
  2:['#2f3350','#e8e9f3'], 4:['#3a3f63','#e8e9f3'], 8:['#5a4bd6','#fff'],
  16:['#7c6cff','#fff'], 32:['#9b6cff','#fff'], 64:['#c56cff','#fff'],
  128:['#ff6ca8','#fff'], 256:['#ff86b7','#fff'], 512:['#ffa057','#fff'],
  1024:['#ffc14d','#2a1e00'], 2048:['#ffd633','#2a1e00'], 4096:['#3ddc97','#04231a'],
};
let grid, score, best = +(localStorage.getItem('g2048_best')||0), idc = 0, over = false, won = false;
// 최고점은 판이 끝났을 때만 적는다. 노는 도중에 적으면 바깥 앱이 그걸
// 5초마다 읽어다 올려서, 한 판에 순위 알림이 몇 번씩 울린다.
// 바깥에서 게임을 닫을 때도 불러 주니(games.js), 하던 판이 날아가지도 않는다.
window.saveBest = function(){ if(best>0) localStorage.setItem('g2048_best', best); };
addEventListener('pagehide', window.saveBest);

document.getElementById('best').textContent = best;

function empty(){ return Array.from({length:N},()=>Array(N).fill(null)); }
function cellSize(){
  const inner = boardEl.clientWidth - 24; // padding 12*2
  return (inner - 12*3)/4; // gap 12
}
function pos(r,c){ const s = cellSize(); return {x:c*(s+12), y:r*(s+12), s}; }

// build background grid
for(let i=0;i<16;i++){ const d=document.createElement('div'); d.className='bg-cell'; boardEl.insertBefore(d, tilesEl); }

function newTile(r,c,val,spawn){
  return {id:++idc, r, c, val, el:null, spawn, merged:false};
}
function addRandom(){
  const cells=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(!grid[r][c]) cells.push([r,c]);
  if(!cells.length) return;
  const [r,c] = cells[Math.floor(Math.random()*cells.length)];
  grid[r][c] = newTile(r,c, Math.random()<0.9?2:4, true);
}
function render(){
  const s = cellSize();
  const seen = new Set();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const t = grid[r][c]; if(!t) continue;
    seen.add(t.id);
    if(!t.el){
      t.el = document.createElement('div');
      t.el.className = 'tile' + (t.spawn?' spawn':'');
      tilesEl.appendChild(t.el);
    }
    const [bg,fg] = colors[t.val] || ['#3ddc97','#04231a'];
    t.el.style.width = t.el.style.height = s+'px';
    t.el.style.background = bg; t.el.style.color = fg;
    t.el.style.fontSize = (t.val<100?s*0.42:t.val<1000?s*0.34:s*0.26)+'px';
    t.el.textContent = t.val;
    // 자리는 변수로 넣는다. transform 에 직접 쓰면 튀어오르는 애니메이션이
    // 그걸 덮어써서 타일이 구석으로 날아갔다 돌아온다.
    const p = pos(t.r,t.c);
    t.el.style.setProperty('--x', p.x+'px');
    t.el.style.setProperty('--y', p.y+'px');
    if(t.merged){
      const cls = t.val>=256 ? 'big' : 'pop';
      t.el.classList.remove('pop','big'); void t.el.offsetWidth;   // 다시 돌게
      t.el.classList.add(cls); t.merged=false;
      setTimeout(()=>t.el&&t.el.classList.remove(cls), cls==='big'?340:190);
    }
    if(t.spawn){ t.spawn=false; setTimeout(()=>t.el&&t.el.classList.remove('spawn'),180); }
  }
  // remove orphan elements
  [...tilesEl.children].forEach(el=>{ if(el._id && !seen.has(el._id)) el.remove(); });
}
function tagEls(){ for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const t=grid[r][c]; if(t&&t.el) t.el._id=t.id; } }

function slide(line){
  // line: array of tiles/null length N -> returns {line,gained,merged}
  const tiles = line.filter(Boolean);
  const out = []; let gained=0, i=0; const mergedTiles=[];
  while(i<tiles.length){
    if(i+1<tiles.length && tiles[i].val===tiles[i+1].val){
      const merged = tiles[i];
      merged.val *= 2; merged.merged = true; gained += merged.val;
      mergedTiles.push(merged);
      tiles[i+1].dead = true; // will be removed
      out.push(merged); i+=2;
    } else { out.push(tiles[i]); i++; }
  }
  while(out.length<N) out.push(null);
  return {line:out, gained, merged:mergedTiles};
}
// ── 효과 ──────────────────────────────────────────────────────────────
const fxEl = document.getElementById('fx');

// 빨리 연달아 두면 사라지기 전에 계속 쌓인다. 오래된 것부터 걷어낸다.
function trimFx(){
  while(fxEl.children.length > 24) fxEl.firstChild.remove();
}

// 합쳐진 그 칸 위에서 점수가 떠오른다. 어디서 몇 점을 벌었는지 보인다.
function floatText(r, c, str, color, size){
  const p = pos(r,c);
  const d = document.createElement('div');
  d.className = 'pt'; d.textContent = str;
  d.style.color = color;
  d.style.fontSize = size+'px';
  // 타일 바로 위에서 떠오르게 한다. 타일 한가운데 두면 숫자와 겹쳐 읽기 힘들다.
  d.style.left = (p.x + p.s/2)+'px';
  d.style.top  = (p.y - 10)+'px';
  fxEl.appendChild(d); trimFx();
  setTimeout(()=>d.remove(), 900);
}
// 판 한가운데 뜨는 큰 문구. 여러 개면 아래로 한 줄씩 내려 쌓는다.
function banner(str, color, size){
  const d = document.createElement('div');
  d.className = 'banner'; d.textContent = str;
  d.style.color = color; d.style.fontSize = size+'px';
  fxEl.appendChild(d); trimFx();
  // 문구가 길어지면 판 밖으로 나가 양끝이 잘린다. 폭에 맞춰 글자를 줄인다.
  const avail = fxEl.clientWidth - 6;
  if(d.scrollWidth > avail) d.style.fontSize = Math.max(12, size * avail / d.scrollWidth) + 'px';
  setTimeout(()=>d.remove(), 950);
}
function flashBoard(){
  boardEl.classList.remove('flash'); void boardEl.offsetWidth;
  boardEl.classList.add('flash');
  setTimeout(()=>boardEl.classList.remove('flash'), 560);
}
function shakeBoard(){
  boardEl.classList.remove('shake'); void boardEl.offsetWidth;
  boardEl.classList.add('shake');
  setTimeout(()=>boardEl.classList.remove('shake'), 310);
}

// ── 소리 ──────────────────────────────────────────────────────────────
// 음원 파일 없이 웹오디오로 만든다. 캣트리스와 같은 방식이다.
let _ac = null;
function actx(){
  if(!_ac){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    _ac = new AC();
  }
  if(_ac.state === 'suspended') _ac.resume();
  return _ac;
}
function tone(freq, t0, dur, type, vol){
  const ac = actx(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
// 합칠 때. 큰 수일수록 낮고 묵직하게 울린다.
function mergeBlip(val){
  const ac = actx(); if(!ac) return;
  try{
    const step = Math.min(9, Math.log2(val) - 2);      // 4→0, 2048→9
    const f = 880 * Math.pow(2, -step/12);
    tone(f, ac.currentTime, 0.13, 'triangle', 0.06);
    tone(f*2, ac.currentTime+0.004, 0.09, 'sine', 0.022);
  }catch(e){}
}
// 콤보가 이어질수록 음이 한 칸씩 올라간다. 귀로 세어진다.
function comboBlip(n){
  const ac = actx(); if(!ac) return;
  try{
    const f = 523.25 * Math.pow(2, Math.min(n,12)*2/12);
    tone(f, ac.currentTime, 0.2, 'triangle', 0.05);
  }catch(e){}
}
function fanfare(){
  const ac = actx(); if(!ac) return;
  try{
    const t0 = ac.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>
      tone(f, t0+i*0.08, 0.4, 'square', 0.055));
  }catch(e){}
}
function sadTone(){
  const ac = actx(); if(!ac) return;
  try{
    const t0 = ac.currentTime;
    [392, 330, 262].forEach((f,i)=> tone(f, t0+i*0.13, 0.35, 'triangle', 0.06));
  }catch(e){}
}

// 콤보는 쉬지 않고 합친 횟수. -1 이면 안 이어지는 중.
// reached 는 처음 만들어 본 숫자들 — 첫 도달 보너스는 한 번만 준다.
let combo = -1, reached = new Set();

let history = [], redoStack = [];
function snapshot(){
  const cells=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const t=grid[r][c]; if(t) cells.push({r,c,val:t.val}); }
  // 콤보와 첫 도달 기록도 같이 담는다. 안 그러면 되돌리기로 첫 도달
  // 보너스를 몇 번이고 다시 받을 수 있다.
  return {cells, score, won, combo, reached:[...reached]};
}
function updateBtns(){
  document.getElementById('undo').disabled = history.length===0;
  document.getElementById('redo').disabled = redoStack.length===0;
}
function restore(s){
  grid = empty();
  [...tilesEl.children].forEach(el=>el.remove());
  s.cells.forEach(o=>{ grid[o.r][o.c] = newTile(o.r,o.c,o.val,false); });
  score = s.score; won = s.won; over = false;
  combo = s.combo ?? -1; reached = new Set(s.reached || []);
  document.getElementById('score').textContent = score;
  bumpChase(score);
  render(); tagEls(); hideOverlay();
}
function undo(){
  if(!history.length) return;
  redoStack.push(snapshot());
  restore(history.pop());
  updateBtns();
}
function redo(){
  if(!redoStack.length) return;
  history.push(snapshot());
  restore(redoStack.pop());
  updateBtns();
}

function move(dir){
  if(over) return;
  // dir: 'l','r','u','d'
  const snap = snapshot();
  let moved=false, gained=0;
  const read = (i,j)=>{
    if(dir==='l') return grid[i][j];
    if(dir==='r') return grid[i][N-1-j];
    if(dir==='u') return grid[j][i];
    return grid[N-1-j][i];
  };
  const write = (i,j,val)=>{
    if(dir==='l') grid[i][j]=val;
    else if(dir==='r') grid[i][N-1-j]=val;
    else if(dir==='u') grid[j][i]=val;
    else grid[N-1-j][i]=val;
  };
  const deadTiles=[], mergedAll=[];
  for(let i=0;i<N;i++){
    const line=[]; for(let j=0;j<N;j++) line.push(read(i,j));
    const before = line.map(t=>t?t.id:0).join(',');
    const {line:res, gained:g, merged:mg} = slide(line);
    gained += g; mergedAll.push(...mg);
    // collect dead (merged-away) tiles for removal after animation
    line.forEach(t=>{ if(t&&t.dead) deadTiles.push(t); });
    const after = res.map(t=>t?t.id:0).join(',');
    if(before!==after) moved=true;
    for(let j=0;j<N;j++){
      const t=res[j];
      if(t){ // update logical coords
        write(i,j,t);
      } else write(i,j,null);
    }
  }
  // set coords from grid position
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const t=grid[r][c]; if(t){ t.r=r; t.c=c; } }
  if(!moved){ deadTiles.forEach(t=>t.dead=false); return; }

  history.push(snap);
  if(history.length>50) history.shift();
  redoStack = [];
  updateBtns();

  // animate dead tiles to their merge target then remove
  deadTiles.forEach(t=>{
    if(t.el){ const p=pos(t.r,t.c);
      t.el.style.setProperty('--x', p.x+'px');
      t.el.style.setProperty('--y', p.y+'px');
      const el=t.el; setTimeout(()=>el.remove(),130); }
  });

  // ── 점수 ────────────────────────────────────────────────────────────
  // 예전엔 합쳐진 값을 그냥 더하기만 했다. 그러면 판을 정리해서 한 번에
  // 터뜨리든 하나씩 흘리든 점수가 똑같아서, 잘 두는 재미가 없다.
  const n = mergedAll.length;
  const chain  = n >= 2 ? Math.round(gained * 0.5 * (n-1)) : 0;   // 한 번에 여럿
  // 콤보는 '연쇄를 이어서 낸 횟수'다. 그냥 합치기만 세면 2048 은 거의
  // 매 수마다 합쳐져서 콤보가 끝없이 쌓인다. 그러면 잘 둔 사람이 아니라
  // 오래 둔 사람이 이기는, 시간 재기가 되어 버린다.
  //
  // 덤은 판이 커질수록 같이 커져야 한다. 40 × 콤보로 못 박아 두면 후반에
  // 512 를 합칠 때는 있으나 마나가 된다. 그래서 그때 터뜨린 값에 비례하게
  // 바꿨다 — 여덟 번 상한은 그대로 두되, 한 칸의 무게가 판을 따라간다.
  combo = n >= 2 ? combo+1 : -1;
  const comboB = combo > 0
    ? Math.round(Math.max(40, gained * 0.15) * Math.min(combo, 8))
    : 0;
  let milestone = 0, topVal = 0;
  for(const t of mergedAll){
    if(t.val > topVal) topVal = t.val;
    if(t.val >= 128 && !reached.has(t.val)){ reached.add(t.val); milestone += t.val*2; }
  }
  // 여기 곱하는 2.5 는 여섯 게임에 똑같이 얹은 값이다.
  //
  // 이 게임 점수는 거의 다 gained — 합친 칸 값의 합이다. 콤보 덤이나
  // 이정표를 아무리 손봐도 총점에서 차지하는 몫이 작아서 표가 안 났다.
  // 그래서 총합에 건다. 모두에게 같은 비율이라 순위는 그대로다.
  const total = Math.round((gained + chain + comboB + milestone) * 2.5);
  score += total;
  document.getElementById('score').textContent = score;
  bumpChase(score);
  if(score>best){ best=score;
    document.getElementById('best').textContent = best; }

  render(); tagEls();

  // ── 눈과 귀 ─────────────────────────────────────────────────────────
  mergedAll.forEach(t=>{
    const c = (colors[t.val]||['#3ddc97'])[0];
    floatText(t.r, t.c, '+'+t.val, c, t.val>=256?21:17);
  });
  // 문구는 한 줄로 합친다. 세 줄이 쌓이면 판을 다 가려서 뭐가 어디
  // 있는지 안 보인다.
  const parts = [];
  if(chain)     parts.push(`${n}연쇄`);
  if(comboB)    parts.push(`${combo}콤보`);
  if(milestone) parts.push(`${topVal} 첫 도달`);
  const bonus = chain + comboB + milestone;
  if(bonus){
    banner(parts.join(' · ') + ` +${bonus}`,
           milestone ? '#ffd633' : chain ? '#8fd9ff' : '#9fe8c0',
           milestone ? 25 : 22);
  }
  if(comboB) comboBlip(combo);
  if(milestone) fanfare();
  if(n) mergeBlip(topVal);
  if(milestone || topVal>=512){ flashBoard(); shakeBoard(); }
  else if(topVal>=128) shakeBoard();

  setTimeout(()=>{ addRandom(); render(); tagEls(); checkEnd(); }, 90);
}
function movesAvailable(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!grid[r][c]) return true;
    const v=grid[r][c].val;
    if(c<N-1 && grid[r][c+1] && grid[r][c+1].val===v) return true;
    if(r<N-1 && grid[r+1][c] && grid[r+1][c].val===v) return true;
  }
  return false;
}
function checkEnd(){
  if(!won){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(grid[r][c]&&grid[r][c].val>=2048){
      won=true; flashBoard(); fanfare(); showOverlay('🎉 2048 달성!', true); return;
    }
  }
  if(!movesAvailable()){ over=true; window.saveBest(); sadTone(); showOverlay('게임 오버', false); }
}
function showOverlay(text, keepPlaying){
  document.getElementById('overlayText').textContent = text;
  document.getElementById('overlay').classList.add('show');
  const btn = document.getElementById('retry');
  btn.textContent = keepPlaying ? '계속 하기' : '다시 하기';
  btn._keep = keepPlaying;
}
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }

function reset(){
  grid = empty(); score=0; over=false; won=false;
  combo = -1; reached = new Set();
  history = []; redoStack = []; updateBtns();
  document.getElementById('score').textContent = 0;
  resetChase();
  [...tilesEl.children].forEach(el=>el.remove());
  fxEl.innerHTML = '';
  addRandom(); addRandom(); render(); tagEls(); hideOverlay();
}
document.getElementById('newGame').onclick = reset;
document.getElementById('undo').onclick = undo;
document.getElementById('redo').onclick = redo;
document.getElementById('retry').onclick = function(){
  if(this._keep){ over=false; hideOverlay(); } else reset();
};

const keymap = {ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',
  a:'l',d:'r',w:'u',s:'d',A:'l',D:'r',W:'u',S:'d'};
window.addEventListener('keydown', e=>{
  // 한글 입력 상태에서는 e.key 가 'ㅋ','ㅛ' 처럼 들어와서 Z·Y·WASD 가
  // 안 먹는다. e.code 는 자판의 물리적 위치라 늘 같다.
  if(e.code==='KeyZ' || (e.code==='Backspace' && e.target.tagName!=='INPUT')){
    e.preventDefault(); undo(); return;
  }
  if(e.code==='KeyY'){ e.preventDefault(); redo(); return; }
  const byCode = {ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',
                  KeyA:'l',KeyD:'r',KeyW:'u',KeyS:'d'};
  const dir = byCode[e.code] || keymap[e.key];
  if(dir){ e.preventDefault(); move(dir); }
});

// touch swipe
let sx,sy;
boardEl.addEventListener('touchstart', e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; }, {passive:true});
boardEl.addEventListener('touchend', e=>{
  if(sx==null) return; const t=e.changedTouches[0];
  const dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'r':'l'); else move(dy>0?'d':'u');
  sx=sy=null;
}, {passive:true});

window.addEventListener('resize', ()=>render());
reset();

/* ---------------- 지금 1등 ----------------
   앱이 순위표 1등을 localStorage 에 적어 둔다(게임과 앱이 같은 사이트라
   함께 쓴다). 혼자 점수를 올리는 게 아니라 누군가를 쫓고 있다는 게
   보여야 재미가 붙는다. 내가 1등이면 쫓을 사람이 없으니 안 띄운다.
   var 와 function 으로 적은 건 이 토막이 파일 맨 끝에 있어서다 —
   위쪽 어디에서 불러도 닿는다. */
var topRec = null, passedTop = false;
try {
  var _t = JSON.parse(localStorage.getItem('dmc_top_2048') || 'null');
  // 내가 1등이어도 띄운다. 예전엔 숨겼는데, 그러면 1등인 사람은 게임 내내
  // 아무 목표도 없이 논다. 내 기록도 넘어야 할 벽이다.
  if (_t && _t.score > 0) topRec = _t;
} catch (e) {}

function bumpChase(cur){
  var el = document.getElementById('chase');
  if (!el) return;
  if (!topRec) { el.classList.add('hide'); return; }
  el.classList.remove('hide');
  if (!passedTop && cur > topRec.score) passedTop = true;
  el.classList.toggle('won', passedTop);
  if (passedTop) {
    document.getElementById('chaseWho').textContent = '👑';
    document.getElementById('chaseVal').textContent = topRec.mine ? '기록 갱신!' : '1등!';
    document.getElementById('chaseFill').style.width = '100%';
  } else {
    document.getElementById('chaseWho').textContent = topRec.mine ? '👑 내 기록' : topRec.name;
    document.getElementById('chaseVal').textContent = topRec.score.toLocaleString('ko-KR');
    document.getElementById('chaseFill').style.width =
      Math.min(100, cur / topRec.score * 100) + '%';
  }
}
function resetChase(){ passedTop = false; bumpChase(0); }
bumpChase(0);
</script>
