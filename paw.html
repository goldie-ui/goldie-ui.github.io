<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0e0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="골디게임">
<title>냥냥펀치</title>
<style>
  :root{
    --bg:#0d1410; --board:#16211a; --line:rgba(255,255,255,.09);
    --text:#eef5ef; --muted:#9db3a4; --faint:#67806f;
    --accent:#ffd15b; --accent2:#7ee08a;
  }
  /* 폰에서 빠르게 두 번 누르면 화면이 확대되고, 그러면서 글자가 잡혀
     '복사하기' 딱지가 떴다. 게임 화면에서 글자를 집을 일은 없으니
     아예 못 잡게 하고, 두 번 눌러 확대하는 것도 막는다.
     touch-action:manipulation 이 두 번 누르기 확대를 없애는 열쇠다. */
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none; user-select:none; -webkit-user-select:none}
  html,body{touch-action:manipulation; overscroll-behavior:none}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,
      "Segoe UI",system-ui,sans-serif;
    background:radial-gradient(760px 520px at 50% -8%,#1d3a28 0%,transparent 60%),var(--bg);
    color:var(--text); min-height:100vh; padding:16px 14px 30px;
    display:flex; flex-direction:column; align-items:center;
  }
  .back{align-self:flex-start; color:var(--muted); text-decoration:none; font-size:14px}
  .back:hover{color:var(--text)}
  h1{font-size:27px; font-weight:900; letter-spacing:-.03em; margin:8px 0 2px;
    background:linear-gradient(104deg,#fff,#ffe08a 55%,#8fe6a0);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .sub{color:var(--faint); font-size:12px; margin-bottom:12px}

  .hud{width:100%; max-width:380px; display:flex; align-items:stretch; gap:8px; margin-bottom:10px}
  .score{flex:1; background:var(--board); border:1px solid var(--line); border-radius:13px;
    padding:8px 12px}
  .score .k{font-size:10px; color:var(--faint); letter-spacing:.1em; text-transform:uppercase}
  .score .v{font-size:21px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1.15}
  .score.warn .v{color:#ff8f8f}

  /* 지금 1등을 쫓는 띠.
     앱에서 게임을 켜면 순위표 1등이 localStorage 로 넘어온다. 혼자 파일만
     열었을 때는 넘어올 게 없어서 이 띠가 아예 안 나온다. */
  .chase{width:100%; max-width:380px; display:flex; align-items:center; gap:9px;
    margin:0 auto 12px; font-size:11.5px; color:#ff9fbb}
  .chase.hide{display:none}
  .chase .who{font-weight:700; white-space:nowrap; max-width:34%;
    overflow:hidden; text-overflow:ellipsis}
  .chase .bar{flex:1; height:5px; border-radius:99px;
    background:rgba(255,255,255,.10); overflow:hidden}
  .chase .bar i{display:block; height:100%; width:0;
    background:linear-gradient(90deg,#ff8fb0,#ffd85b); transition:width .35s ease}
  .chase .val{font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap}
  .chase.won{color:#ffd85b}
  .chase.won .bar i{background:#ffd85b; animation:chasePulse 1.1s ease-in-out infinite}
  @keyframes chasePulse{50%{opacity:.4}}

  /* 이번 탄이 뭐고 목표까지 얼마나 왔는지. 판 바로 위에 둬야 눈이 간다. */
  .goal{width:100%; max-width:380px; display:flex; align-items:center; gap:9px;
    margin:0 auto 10px; font-size:11.5px; color:var(--muted)}
  .goal .stage{white-space:nowrap}
  .goal .stage b{color:var(--accent); font-weight:800}
  .goal .stage i{font-style:normal; color:var(--faint)}
  .goal .bar{flex:1; height:6px; border-radius:99px;
    background:rgba(255,255,255,.10); overflow:hidden}
  .goal .bar i{display:block; height:100%; width:0;
    background:linear-gradient(90deg,#7ee08a,#ffd15b); transition:width .25s ease}
  .goal .bar.done i{background:#ffd15b}
  .goal .num{white-space:nowrap; font-variant-numeric:tabular-nums}
  .goal .num b{color:var(--text); font-weight:800}

  .stage{position:relative; width:100%; max-width:380px}
  canvas{display:block; width:100%; height:auto; background:var(--board);
    border:1px solid var(--line); border-radius:16px; touch-action:none; cursor:pointer}

  .screen{position:absolute; inset:0; border-radius:16px; z-index:5;
    background:rgba(10,18,13,.90); backdrop-filter:blur(6px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:13px; padding:22px; text-align:center}
  .screen.hide{display:none}
  .screen h2{font-size:26px; font-weight:900}
  .screen p{color:var(--muted); font-size:13.5px; line-height:1.6}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#12250f;
    border:none; border-radius:13px; padding:13px 32px; font-weight:900; font-size:16px;
    cursor:pointer}
  .btn:active{transform:scale(.97)}

  /* 뭐가 나오고 뭘 때리면 안 되는지. 한 번 보면 아는 것들이라 작게 둔다. */
  .legend{width:100%; max-width:380px; margin-top:12px; display:flex; flex-wrap:wrap;
    gap:5px 12px; justify-content:center; font-size:10.5px; color:var(--faint)}
  .legend b{color:var(--muted); font-weight:700}

  @media (max-width:640px){
    .stage{width:fit-content; max-width:100%; margin:0 auto}
    #cv{height:min(56vh, 520px); width:auto; max-width:100%}
    body{padding:12px 12px 16px}
    h1{font-size:23px; margin:6px 0 1px}
    .sub{font-size:11px; margin-bottom:9px}
    .hud{margin-bottom:8px}
    .score{padding:6px 10px}
    .score .v{font-size:18px}
  }
  @media (max-height:560px) and (orientation:landscape){
    body{flex-direction:row; align-items:center; justify-content:center; gap:14px; padding:8px}
    h1,.sub,.legend{display:none}
    .back{position:absolute; top:6px; left:10px; font-size:12px}
    .stage{max-width:none; height:calc(100vh - 20px); width:auto}
    canvas{height:100%; width:auto}
    .hud{flex-direction:column; width:auto; max-width:none; margin:0}
  }
</style>
</head>
<body>
<a class="back" href="index.html">← 골디 게임</a>
<h1 id="title">🐾 냥냥펀치</h1>
<div class="sub">구멍에서 나온 쥐를 앞발로 탁!</div>

<div class="hud">
  <div class="score"><div class="k">점수</div><div class="v" id="score">0</div></div>
  <div class="score"><div class="k">최고</div><div class="v" id="best">0</div></div>
  <div class="score" id="timeBox"><div class="k">남은 시간</div><div class="v" id="time">18</div></div>
</div>

<div class="goal">
  <span class="stage"><b id="stageNo">1탄</b> <i id="stageName">첫 사냥</i></span>
  <span class="bar" id="goalBar"><i id="goalFill"></i></span>
  <span class="num"><b id="goalNow">0</b> / <span id="goalNeed">110</span></span>
</div>

<div class="chase hide" id="chase">
  <span class="who" id="chaseWho">1등</span>
  <span class="bar"><i id="chaseFill"></i></span>
  <span class="val" id="chaseVal">0</span>
</div>

<div class="stage">
  <canvas id="cv" width="360" height="420"></canvas>
  <div class="screen" id="startScreen">
    <h2>🐾 냥냥펀치</h2>
    <p>구멍에서 나온 <b>쥐</b>를 앞발로 탁!<br>
       고양이 친구는 때리면 안 돼요.</p>
    <button class="btn" id="startBtn">시작</button>
  </div>
  <div class="screen hide" id="overScreen">
    <h2 id="overTitle">끝!</h2>
    <p id="overText"></p>
    <button class="btn" id="retryBtn">다시 하기</button>
  </div>
</div>

<div class="legend">
  <span><b>🐭 쥐</b> +10</span>
  <span><b>✨ 황금쥐</b> +80</span>
  <span><b>🍤 츄르</b> 시간 +1.5초</span>
  <span><b>🐱 고양이</b> 때리면 −20점, 시간 −1초</span>
  <span><b>연속</b> 2번부터 배수가 붙어요 · 최대 ×8</span>
</div>

<script>
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const $ = s => document.querySelector(s);
const W = cv.width, H = cv.height;

/* ---------------- 판 ----------------
   구멍은 세 줄 세 칸, 아홉 개. 폰에서 엄지로 누르는 게임이라 칸을 크게
   잡았다 — 한 칸이 120픽셀이면 웬만한 손끝보다 훨씬 넉넉하다. */
const COLS = 3, ROWS = 3;
const CW = W / COLS, CH = (H - 30) / ROWS;
const HOLES = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  HOLES.push({ x: c * CW + CW / 2, y: 30 + r * CH + CH * 0.62, occ: null, shake: 0 });
}
const HR = Math.min(CW, CH) * 0.40;      // 구멍 반지름

/* ---------------- 나오는 것들 ----------------
   쥐는 잡는 것, 고양이는 때리면 안 되는 것. 이 둘이 섞여야 마구 두드리는
   게 안 통한다. 츄르는 시간을 벌어 주니 한 판을 늘리고 싶으면 놓치면 안 된다.

   황금쥐는 값이 다섯 배지만 머무는 시간이 절반이다. 눈에 띄자마자 손이
   나가야 잡힌다 — 여기서 반응이 빠른 사람이 벌어진다. */
const KINDS = {
  mouse: { score: 10,  dur: 1.00 },
  gold:  { score: 80,  dur: 0.52 },   // 쥐 여덟 마리 값인데 머무는 건 절반
  chur:  { score: 5,   dur: 0.85 },   // 시간을 벌어 준다
  cat:   { score: -20, dur: 1.05 },   // 때리면 안 된다
};

/* ---------------- 탄 ----------------
   한 탄은 열여덟 초. 그 안에 목표 점수를 못 채우면 거기서 끝난다.
   버티기만 해서는 못 넘어가고, 계속 잡아야 다음 탄이 열린다.

   1탄은 한 마리씩 천천히. 2탄은 그대로 빨라지고, 3탄부터 두 마리씩
   나온다. 뒤로 갈수록 머무는 시간이 짧아지고 고양이도 늘어난다.

   8탄을 넘기면 끝이 아니라 무한이다. 잘하는 사람이 갈 데가 없으면
   순위표가 금방 굳는다. */
const STAGE_TIME = 18;
const STAGES = [
  { n:1, name:'첫 사냥',   up:1, dur:1.20, gap:0.90, cat:0.10, goal:110 },
  { n:2, name:'빨라진다',  up:1, dur:0.98, gap:0.66, cat:0.14, goal:190 },
  { n:3, name:'둘씩',      up:2, dur:0.92, gap:0.60, cat:0.16, goal:300 },
  { n:4, name:'더 빨리',   up:2, dur:0.80, gap:0.50, cat:0.18, goal:420 },
  { n:5, name:'셋씩',      up:3, dur:0.74, gap:0.45, cat:0.20, goal:560 },
  { n:6, name:'눈코 뜰 새',up:3, dur:0.64, gap:0.38, cat:0.22, goal:720 },
  { n:7, name:'폭풍',      up:4, dur:0.57, gap:0.33, cat:0.24, goal:900 },
  { n:8, name:'끝판',      up:4, dur:0.50, gap:0.29, cat:0.26, goal:1100 },
];
// 8탄을 넘기면 이걸로 계속 만들어 낸다. 조금씩만 조인다.
function stageAt(i) {
  if (i < STAGES.length) return STAGES[i];
  const k = i - STAGES.length + 1;
  const last = STAGES[STAGES.length - 1];
  return {
    n: i + 1, name: '무한 ' + k,
    up: 4,
    dur: Math.max(0.34, last.dur - 0.02 * k),
    gap: Math.max(0.20, last.gap - 0.012 * k),
    cat: Math.min(0.34, last.cat + 0.01 * k),
    goal: Math.round(last.goal * Math.pow(1.24, k)),
  };
}

const FAST_WINDOW = 0.35;         // 이 안에 때리면 '칼같이'

let score = 0, best = 0, combo = 0, bestCombo = 0;
let hits = 0, misses = 0, oops = 0, golds = 0;
let playing = false, over = false, raf = null, lastT = 0;
let spawnTimer = 0;
let texts = [], parts = [], paws = [], flash = 0, shake = 0;

// 탄 상태
let stageIdx = 0, stage = STAGES[0];
let stageTime = STAGE_TIME, stageScore = 0;
let stageMiss = 0, stageOops = 0;     // 이번 탄에서 놓치거나 헛친 횟수
let goalAt = -1;                      // 목표를 처음 넘긴 순간의 남은 시간
let perfectRun = 0;                   // 무실수로 이어 온 탄 수
let banner = null;                    // 탄 이름 띠
let between = 0;                      // 탄과 탄 사이 잠깐 멈춤
let intro = 0;                        // 탄 안내를 보여 주는 동안

/* ---------------- 타격감 ----------------
   맞은 게 스르르 들어가면 때린 맛이 안 난다. 세 가지를 겹친다.
     멈춤   — 맞는 순간 세상이 몇 프레임 멎는다. 이게 제일 크다.
     날아감 — 맞은 놈이 구멍으로 들어가는 게 아니라 빙글빙글 튀어 오른다.
     충격파 — 때린 자리에서 동그란 파문이 퍼진다.
   여기에 화면 흔들림과 퍽 소리를 얹는다. */
let hitStop = 0, rings = [], flying = [];

const BEST_KEY = 'paw_best';
try { best = +(localStorage.getItem(BEST_KEY) || 0); } catch (e) {}
$('#best').textContent = best;

// 최고점은 판이 끝났을 때만 적는다. 노는 도중에 적으면 바깥 앱이 그걸
// 5초마다 읽어다 올려서, 한 판에 순위 알림이 몇 번씩 울린다.
window.saveBest = function () {
  try {
    if (score > best) best = score;
    if (best > 0) localStorage.setItem(BEST_KEY, best);
  } catch (e) {}
};
addEventListener('pagehide', window.saveBest);

/* ---------------- 난이도 ----------------
   이제 탄이 정한다. 생선을 먹으면 잠깐 다들 굼떠져서 머무는 시간이 길어진다. */
const popDur  = k => KINDS[k].dur * stage.dur;
const gapTime = () => stage.gap;
const maxUp   = () => stage.up;

// 무엇이 나올지. 황금쥐는 드물어야 값어치가 산다.
function rollKind() {
  const r = Math.random();
  let a = 0.07;             if (r < a) return 'gold';
  a += 0.06;                if (r < a) return 'chur';
  a += stage.cat;           if (r < a) return 'cat';
  return 'mouse';
}

/* ---------------- 연속 가중치 ----------------
   둘만 이어도 배수가 붙고, 위로 갈수록 간격이 벌어진다.
   2·4·7·11·16·22·30·40·55 에서 한 칸씩 올라 최대 여덟 배다.

   한 마리 한 마리의 값이 아니라 '끊기지 않고 가는 것' 자체가 점수가 된다.
   그래서 애매한 놈을 무리해서 치기보다, 확실한 것만 골라 이어 가는 판단이
   생긴다. 고양이를 치거나 쥐를 놓치면 그 자리에서 1배로 돌아간다 —
   길게 이었을수록 잃는 게 커서, 뒤로 갈수록 손이 떨린다. */
// 다섯 번마다 반씩 올리는 식으로 뒀다가 재 보고 바꿨다. 서툰 사람은
// 한 방의 88%가 ×1 이었다 — 배수가 있다는 걸 아예 못 느낀다는 뜻이다.
// 칸을 셋으로 좁혀 봐도 84% 로 별 차이가 없었다. 문제는 칸 간격이 아니라
// 연속이 자꾸 끊긴다는 것이었다.
//
// 그래서 아래쪽을 촘촘하게 깔았다. 둘만 이어도 뭔가 붙는다. 대신 위로
// 갈수록 간격을 벌려서, 오래 이은 사람만 큰 배수에 닿는다.
const COMBO_TIERS = [
  { at: 2,  m: 1.2 },
  { at: 4,  m: 1.5 },
  { at: 7,  m: 2   },
  { at: 11, m: 2.5 },
  { at: 16, m: 3   },
  { at: 22, m: 4   },
  { at: 30, m: 5   },
  { at: 40, m: 6.5 },
  { at: 55, m: 8   },
];
const COMBO_MAX = 8;
function comboMult() {
  let m = 1;
  for (const t of COMBO_TIERS) { if (combo >= t.at) m = t.m; else break; }
  return m;
}

function popOne() {
  const free = HOLES.filter(h => !h.occ);
  if (!free.length) return;
  const h = free[(Math.random() * free.length) | 0];
  const kind = rollKind();
  h.occ = { kind, t: 0, dur: popDur(kind) };
  pop();
}

// 구멍 밖으로 얼마나 나와 있는지, 0 에서 1 사이로.
// 쑥 올라왔다가 잠깐 머물고 쏙 들어간다.
function upness(o) {
  const p = o.t / o.dur;
  if (p < 0.16) { const q = p / 0.16; return 1 - (1 - q) * (1 - q); }   // 쑥
  if (p > 0.84) { const q = (1 - p) / 0.16; return q * q; }            // 쏙
  return 1;
}

/* ---------------- 때리기 ---------------- */
function whack(px, py) {
  if (!playing || over) return;
  paws.push({ x: px, y: py, t: 0 });

  // 누른 자리에서 가장 가까운 구멍. 손끝이 조금 빗나가도 잡히게 넉넉히 본다.
  let target = null, bestD = 1e9;
  for (const h of HOLES) {
    if (!h.occ) continue;
    if (upness(h.occ) < 0.34) continue;              // 아직 덜 나왔으면 못 때린다
    const d = Math.hypot(px - h.x, py - h.y - HR * 0.35);
    if (d < HR * 1.35 && d < bestD) { bestD = d; target = h; }
  }
  if (!target) { swish(); return; }

  const o = target.occ, K = KINDS[o.kind];
  target.shake = 1;

  // 맞은 놈은 그 자리에서 사라지고, 대신 빙글빙글 튀어 오르는 놈이 생긴다.
  const oy = target.y + HR * 0.22 - upness(o) * HR * 0.82;
  flying.push({ kind: o.kind, x: target.x, y: oy,
                vx: (Math.random() - 0.5) * 300, vy: -430 - Math.random() * 120,
                rot: 0, vr: (Math.random() - 0.5) * 22, life: 1 });
  target.occ = null;

  if (o.kind === 'cat') {
    // 고양이 친구를 때렸다. 점수도 시간도 깎이고 연속도 끊긴다.
    // 이번 탄의 '무실수'도 이걸로 날아간다.
    oops++; stageOops++;
    score = Math.max(0, score - 20);
    stageScore = Math.max(0, stageScore - 20);
    stageTime = Math.max(0, stageTime - 1);
    combo = 0;
    say('아야! −20', '#ff8f8f', 24, target);
    burst(target.x, target.y, '#ff8f8f', 14);
    rings.push({ x: target.x, y: oy, r: HR * 0.35, life: 1, col: '#ff8f8f' });
    hitStop = Math.max(hitStop, 0.075);
    addShake(11); wrong(); punch(0.6);
    bump();
    return;
  }

  hits++;
  combo++;
  if (combo > bestCombo) bestCombo = combo;

  // 나오자마자 때리면 두 배. 늦게 때려도 잡히기는 하지만 값이 다르다.
  const fast = o.t <= FAST_WINDOW;
  const mult = comboMult();
  let gain = Math.round(K.score * (fast ? 2 : 1) * mult);

  if (o.kind === 'chur') {
    stageTime = Math.min(STAGE_TIME * 1.5, stageTime + 1.5);
    say('츄르! 시간 +1.5초', '#ffb38a', 21, target);
    rings.push({ x: target.x, y: oy, r: HR * 0.3, life: 1.1, col: '#ffb38a' });
    hitStop = Math.max(hitStop, 0.05); addShake(7);
    churSound(); punch(0.6);
  } else if (o.kind === 'gold') {
    golds++;
    say('황금쥐! +' + gain, '#ffd75e', 26, target);
    burst(target.x, target.y, '#ffd75e', 26);
    rings.push({ x: target.x, y: oy, r: HR * 0.35, life: 1, col: '#ffd75e' });
    rings.push({ x: target.x, y: oy, r: HR * 0.1, life: 1.3, col: '#fff3b0' });
    flash = 1; addShake(16); hitStop = Math.max(hitStop, 0.09);
    ding(); punch(1);
  } else {
    say('+' + gain, fast ? '#8fe6a0' : '#cfe9ff', fast ? 23 : 19, target);
    burst(target.x, target.y, '#8fe6a0', fast ? 16 : 11);
    rings.push({ x: target.x, y: oy, r: HR * 0.30, life: 1, col: fast ? '#8fe6a0' : '#cfe9ff' });
    addShake(fast ? 9 : 6);
    hitStop = Math.max(hitStop, fast ? 0.055 : 0.04);
    thud(Math.min(combo, 12)); punch(fast ? 0.8 : 0.55);
  }
  if (fast && o.kind !== 'chur') say2('칼같이! 두 배', '#8fe6a0', target);
  // 배수가 한 칸 오르는 순간만 크게 알린다. 매번 띄우면 화면이 시끄럽다.
  if (COMBO_TIERS.some(t => t.at === combo)) {
    say2(combo + '연속! ×' + comboMult(), combo >= 16 ? '#ffd75e' : '#9fe8c0', target, 30);
    ding();
  }

  score += gain;
  stageScore += gain;
  bump();
  refreshHud();
  // 목표를 처음 넘긴 순간의 남은 시간을 적어 둔다. 일찍 채울수록 덤이 크다.
  if (goalAt < 0 && stageScore >= stage.goal) {
    goalAt = stageTime;
    say2('목표 달성!', '#ffd75e', target, 54);
    ding();
  }
}

function bump() {
  $('#score').textContent = score.toLocaleString('ko-KR');
  if (score > best) { best = score; $('#best').textContent = best.toLocaleString('ko-KR'); }
  bumpChase(score);
}

function say(str, col, size, h) {
  texts.push({ x: h ? h.x : W / 2, y: (h ? h.y : H / 2) - HR * 0.8, str, col, size, life: 1, vy: -34 });
}
function say2(str, col, h, dy) {
  texts.push({ x: h ? h.x : W / 2, y: (h ? h.y : H / 2) - HR * 0.8 + (dy || 24),
               str, col, size: 17, life: 1, vy: -26 });
}
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, sp = 40 + Math.random() * 150;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
                 life: 1, r: 2 + Math.random() * 3, col });
  }
}
function addShake(m) { shake = Math.max(shake, m); }

/* ---------------- 그리기 ---------------- */
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// 쥐. 회색 몸에 큰 분홍 귀, 뾰족한 코. 고양이랑 헷갈리면 안 되니까
// 귀를 동그랗게 크게, 주둥이를 길게 뺐다.
function drawMouse(c, x, y, r, gold) {
  const body = gold ? '#ffd75e' : '#b9c2cf', dark = gold ? '#e0a017' : '#8c96a6';
  // 귀
  c.fillStyle = dark;
  for (const s of [-1, 1]) {
    c.beginPath(); c.arc(x + s * r * 0.72, y - r * 0.62, r * 0.40, 0, 6.284); c.fill();
  }
  c.fillStyle = 'rgba(255,170,190,.75)';
  for (const s of [-1, 1]) {
    c.beginPath(); c.arc(x + s * r * 0.72, y - r * 0.62, r * 0.24, 0, 6.284); c.fill();
  }
  // 얼굴
  const g = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.15, x, y, r);
  g.addColorStop(0, gold ? '#fff2c0' : '#dbe2ea'); g.addColorStop(1, body);
  c.fillStyle = g;
  c.beginPath(); c.ellipse(x, y, r * 0.86, r * 0.80, 0, 0, 6.284); c.fill();
  // 주둥이
  c.fillStyle = gold ? '#fff6d8' : '#eef2f7';
  c.beginPath(); c.ellipse(x, y + r * 0.34, r * 0.42, r * 0.30, 0, 0, 6.284); c.fill();
  // 눈
  c.fillStyle = 'rgba(28,26,34,.9)';
  for (const s of [-1, 1]) {
    c.beginPath(); c.ellipse(x + s * r * 0.30, y - r * 0.06, r * 0.10, r * 0.13, 0, 0, 6.284); c.fill();
  }
  c.fillStyle = 'rgba(255,255,255,.95)';
  for (const s of [-1, 1]) {
    c.beginPath(); c.arc(x + s * r * 0.30 + r * 0.04, y - r * 0.11, r * 0.04, 0, 6.284); c.fill();
  }
  // 코와 수염
  c.fillStyle = '#ff7a9c';
  c.beginPath(); c.ellipse(x, y + r * 0.30, r * 0.09, r * 0.07, 0, 0, 6.284); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = Math.max(1, r * 0.035);
  for (const s of [-1, 1]) for (const k of [-0.1, 0.1]) {
    c.beginPath();
    c.moveTo(x + s * r * 0.14, y + r * 0.30);
    c.lineTo(x + s * r * 0.78, y + r * (0.24 + k));
    c.stroke();
  }
  if (gold) {
    c.fillStyle = 'rgba(255,255,255,.9)';
    for (const [sx, sy, ss] of [[-0.62, -0.1, 0.11], [0.58, 0.24, 0.08]]) {
      c.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = k / 8 * 6.284, rad = (k % 2 ? ss * 0.4 : ss) * r;
        c.lineTo(x + sx * r + Math.cos(a) * rad, y + sy * r + Math.sin(a) * rad);
      }
      c.closePath(); c.fill();
    }
  }
}

// 고양이 친구. 삼각 귀에 감은 눈 — 한눈에 '때리면 안 되는 것'으로 보여야
// 해서 쥐랑 최대한 다르게 그렸다.
function drawCat(c, x, y, r) {
  c.fillStyle = '#d8b78e';
  for (const s of [-1, 1]) {
    c.beginPath();
    c.moveTo(x + s * r * 0.78, y - r * 0.40);
    c.lineTo(x + s * r * 0.88, y - r * 1.02);
    c.lineTo(x + s * r * 0.16, y - r * 0.78);
    c.closePath(); c.fill();
  }
  c.fillStyle = 'rgba(255,150,180,.55)';
  for (const s of [-1, 1]) {
    c.beginPath();
    c.moveTo(x + s * r * 0.68, y - r * 0.48);
    c.lineTo(x + s * r * 0.74, y - r * 0.88);
    c.lineTo(x + s * r * 0.32, y - r * 0.72);
    c.closePath(); c.fill();
  }
  const g = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.15, x, y, r);
  g.addColorStop(0, '#fff0dc'); g.addColorStop(1, '#f0d3ac');
  c.fillStyle = g;
  c.beginPath(); c.arc(x, y, r * 0.90, 0, 6.284); c.fill();
  // 감은 눈 — 기분 좋게 웃고 있다
  c.strokeStyle = 'rgba(40,32,26,.8)'; c.lineWidth = Math.max(1.6, r * 0.09); c.lineCap = 'round';
  for (const s of [-1, 1]) {
    c.beginPath();
    c.arc(x + s * r * 0.32, y + r * 0.06, r * 0.19, Math.PI + 0.35, -0.35);
    c.stroke();
  }
  c.fillStyle = 'rgba(255,140,170,.28)';
  for (const s of [-1, 1]) {
    c.beginPath(); c.ellipse(x + s * r * 0.55, y + r * 0.26, r * 0.20, r * 0.13, 0, 0, 6.284); c.fill();
  }
  c.fillStyle = '#ff7a9c';
  c.beginPath();
  c.moveTo(x, y + r * 0.34); c.lineTo(x - r * 0.11, y + r * 0.20); c.lineTo(x + r * 0.11, y + r * 0.20);
  c.closePath(); c.fill();
  c.strokeStyle = 'rgba(40,32,26,.55)'; c.lineWidth = Math.max(1, r * 0.04);
  c.beginPath();
  c.moveTo(x, y + r * 0.34); c.lineTo(x, y + r * 0.46);
  c.moveTo(x, y + r * 0.46); c.quadraticCurveTo(x - r * 0.16, y + r * 0.60, x - r * 0.26, y + r * 0.42);
  c.moveTo(x, y + r * 0.46); c.quadraticCurveTo(x + r * 0.16, y + r * 0.60, x + r * 0.26, y + r * 0.42);
  c.stroke();
}

// 츄르 봉지
function drawChur(c, x, y, r) {
  c.save(); c.translate(x, y); c.rotate(-0.25);
  const g = c.createLinearGradient(-r * 0.3, 0, r * 0.3, 0);
  g.addColorStop(0, '#ffd9bd'); g.addColorStop(0.5, '#ff9e6b'); g.addColorStop(1, '#e0713d');
  c.fillStyle = g;
  roundRect(c, -r * 0.26, -r * 0.86, r * 0.52, r * 1.72, r * 0.24); c.fill();
  c.fillStyle = 'rgba(255,255,255,.55)';
  roundRect(c, -r * 0.30, -r * 0.98, r * 0.60, r * 0.20, r * 0.08); c.fill();
  roundRect(c, -r * 0.30, r * 0.78, r * 0.60, r * 0.20, r * 0.08); c.fill();
  c.fillStyle = 'rgba(255,255,255,.35)';
  roundRect(c, -r * 0.14, -r * 0.60, r * 0.10, r * 1.2, r * 0.05); c.fill();
  c.restore();
}

// 종류별로 알맞은 크기에 맞춰 그린다. 구멍 안에서든 날아갈 때든 같은 크기.
function drawKind(c, kind, x, y) {
  if (kind === 'cat')       drawCat(c, x, y, HR * 0.95);
  else if (kind === 'chur') drawChur(c, x, y, HR * 0.95);
  else                      drawMouse(c, x, y, HR * 0.92, kind === 'gold');
}

function draw() {
  cx.clearRect(0, 0, W, H);
  cx.save();
  if (shake > 0) cx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  if (flash > 0) {
    cx.fillStyle = `rgba(255,215,94,${flash * 0.22})`;
    cx.fillRect(0, 0, W, H);
  }

  // 잔디밭 결. 구멍만 덩그러니 있으면 허전해서 옅은 줄을 깔았다.
  cx.strokeStyle = 'rgba(255,255,255,.03)'; cx.lineWidth = 1;
  for (let y = 20; y < H; y += 14) {
    cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
  }

  for (const h of HOLES) {
    const sx = h.shake > 0 ? (Math.random() - 0.5) * h.shake * 6 : 0;

    // 구멍.
    //
    // 처음엔 구멍 안쪽만 어둡게 칠했는데, 판 바탕도 어두워서 둘이 구별이
    // 안 됐다. 그래서 쥐가 구멍에 앉은 게 아니라 허공에 뜬 것처럼 보였다.
    // 둘레에 흙 두둑을 밝게 두르니 그제야 구멍으로 읽힌다.
    cx.fillStyle = '#31402c';
    cx.beginPath(); cx.ellipse(h.x + sx, h.y + HR * 0.30, HR * 1.18, HR * 0.50, 0, 0, 6.284); cx.fill();
    cx.fillStyle = '#3d5036';
    cx.beginPath(); cx.ellipse(h.x + sx, h.y + HR * 0.24, HR * 1.10, HR * 0.44, 0, 0, 6.284); cx.fill();
    cx.fillStyle = '#060a07';
    cx.beginPath(); cx.ellipse(h.x + sx, h.y + HR * 0.22, HR * 0.94, HR * 0.34, 0, 0, 6.284); cx.fill();

    // 나온 것. 구멍 안쪽으로만 보이게 잘라 그린다.
    if (h.occ && !h.occ.gone) {
      const o = h.occ;
      const up = upness(o);
      cx.save();
      cx.beginPath();
      cx.rect(h.x + sx - HR * 1.2, 0, HR * 2.4, h.y + HR * 0.22);
      cx.clip();
      // 턱이 앞턱 뒤로 들어가는 높이.
      //
      // 처음엔 구멍 언저리에 겨우 걸치게 뒀는데, 그러면 얼굴 밑에 구멍
      // 속 어둠이 반달로 남아서 허공에 뜬 것처럼 보였다. 얼굴을 키우고
      // 조금 더 내려서 턱이 앞턱에 파묻히게 했다.
      const oy = h.y + HR * 0.22 - up * HR * 0.65;
      cx.save();
      cx.translate(h.x + sx, oy);
      drawKind(cx, o.kind, 0, 0);
      cx.restore();
      cx.restore();
    }

    // 구멍 앞턱. 나온 것의 밑동을 가려 줘야 진짜 구멍처럼 보인다.
    // 아래쪽 반원이다 — 위쪽 반원을 그리면 얼굴을 덮어 버린다.
    cx.fillStyle = '#44593c';
    cx.beginPath();
    cx.ellipse(h.x + sx, h.y + HR * 0.22, HR * 0.94, HR * 0.34, 0, 0, Math.PI, false);
    cx.closePath(); cx.fill();
    cx.strokeStyle = 'rgba(0,0,0,.45)'; cx.lineWidth = 2;
    cx.beginPath(); cx.ellipse(h.x + sx, h.y + HR * 0.22, HR * 0.94, HR * 0.34, 0, 0, 6.284); cx.stroke();
  }

  // 맞고 튀어 오른 놈들. 빙글빙글 돌면서 날아간다.
  for (const f of flying) {
    cx.save();
    cx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.4));
    cx.translate(f.x, f.y); cx.rotate(f.rot);
    drawKind(cx, f.kind, 0, 0);
    cx.restore();
  }
  cx.globalAlpha = 1;

  // 때린 자리에서 퍼지는 파문
  for (const g of rings) {
    const p = 1 - g.life;
    cx.globalAlpha = Math.max(0, g.life) * 0.75;
    cx.strokeStyle = g.col;
    cx.lineWidth = Math.max(1, 7 * g.life);
    cx.beginPath(); cx.arc(g.x, g.y, g.r + p * HR * 1.5, 0, 6.284); cx.stroke();
  }
  cx.globalAlpha = 1;

  // 튄 것들
  for (const p of parts) {
    cx.globalAlpha = Math.max(0, p.life);
    cx.fillStyle = p.col;
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.284); cx.fill();
  }
  cx.globalAlpha = 1;

  // 앞발 자국
  for (const w of paws) {
    const a = Math.max(0, 1 - w.t * 3.2), s = 1 + w.t * 2.2;
    cx.globalAlpha = a * 0.8;
    cx.fillStyle = '#ffd9e4';
    cx.beginPath(); cx.ellipse(w.x, w.y + 5 * s, 11 * s, 9 * s, 0, 0, 6.284); cx.fill();
    for (const [dx, dy] of [[-11, -6], [-4, -11], [4, -11], [11, -6]]) {
      cx.beginPath(); cx.arc(w.x + dx * s, w.y + dy * s, 4 * s, 0, 6.284); cx.fill();
    }
    cx.globalAlpha = 1;
  }

  cx.restore();

  // 글자는 흔들림 밖에서 그린다. 같이 떨면 읽기가 힘들다.
  cx.textAlign = 'center';
  for (const t of texts) {
    cx.globalAlpha = Math.max(0, Math.min(1, t.life * 1.6));
    cx.fillStyle = t.col;
    // 뜨는 순간 크게 튀었다가 제 크기로 줄어든다
    const age = 1 - t.life;
    const pop = age < 0.12 ? 1.5 - (age / 0.12) * 0.5 : 1;
    cx.font = `900 ${Math.round(t.size * pop)}px "Pretendard",system-ui,sans-serif`;
    cx.fillText(t.str, t.x, t.y);
  }
  // 지금 몇 연속이고 몇 배인지. 이게 보여야 이어 갈 마음이 든다.
  if (combo >= 2) {
    const m = comboMult();
    cx.textAlign = 'center';
    cx.fillStyle = m >= 5 ? '#ff8fb0' : (m >= 3 ? '#ffd75e' : (m >= 2 ? '#ffb38a' : '#9fe8c0'));
    cx.font = '900 20px "Pretendard",system-ui,sans-serif';
    cx.fillText(combo + '연속', W / 2, 20);
    if (m > 1) {
      // 배수가 클수록 글자도 커진다. 얼마나 크게 쌓였는지가 눈에 보여야 아깝다.
      cx.font = `900 ${Math.round(15 + (m - 1) * 3)}px "Pretendard",system-ui,sans-serif`;
      cx.fillText('×' + m, W / 2, 42);
    }
    cx.textAlign = 'start';
  }

  // 탄 이름 띠. 탄이 바뀔 때와 통과할 때 크게 알린다.
  if (banner) {
    const p = banner.t / banner.life;
    // 들어올 때 쑥, 나갈 때 스르르
    const a = p < 0.12 ? p / 0.12 : (p > 0.78 ? (1 - p) / 0.22 : 1);
    const slide = p < 0.12 ? (1 - p / 0.12) * 40 : 0;
    cx.save();
    cx.globalAlpha = Math.max(0, Math.min(1, a));
    cx.translate(0, slide);
    cx.fillStyle = 'rgba(8,14,10,.78)';
    cx.fillRect(0, H * 0.36, W, 92);
    cx.strokeStyle = banner.col; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(0, H * 0.36); cx.lineTo(W, H * 0.36);
    cx.moveTo(0, H * 0.36 + 92); cx.lineTo(W, H * 0.36 + 92); cx.stroke();
    cx.textAlign = 'center';
    cx.fillStyle = banner.col;
    cx.font = '900 30px "Pretendard",system-ui,sans-serif';
    cx.fillText(banner.top, W / 2, H * 0.36 + 42);
    cx.fillStyle = '#dfeadf';
    cx.font = '700 15px "Pretendard",system-ui,sans-serif';
    cx.fillText(banner.bottom, W / 2, H * 0.36 + 70);
    cx.restore();
  }

  cx.globalAlpha = 1;
  cx.textAlign = 'start';
}

function stepFx(dt) {
  for (const t of texts) { t.life -= dt * 1.1; t.y += t.vy * dt; }
  texts = texts.filter(t => t.life > 0);
  for (const p of parts) {
    p.life -= dt * 1.5; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 620 * dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const w of paws) w.t += dt;
  paws = paws.filter(w => w.t < 0.34);
  for (const f of flying) {
    f.life -= dt * 1.15; f.x += f.vx * dt; f.y += f.vy * dt;
    f.vy += 1250 * dt; f.rot += f.vr * dt;
  }
  flying = flying.filter(f => f.life > 0 && f.y < H + 120);
  for (const g of rings) g.life -= dt * 2.6;
  rings = rings.filter(g => g.life > 0);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
  for (const h of HOLES) if (h.shake > 0) h.shake = Math.max(0, h.shake - dt * 4);
  if (banner) { banner.t += dt; if (banner.t > banner.life) banner = null; }
}

/* ---------------- 탄 넘기기 ---------------- */
function showBanner(top, bottom, col, life) {
  banner = { top, bottom, col, t: 0, life: life || 1.8 };
}

function beginStage(i) {
  stageIdx = i;
  stage = stageAt(i);
  stageTime = STAGE_TIME;
  stageScore = 0;
  stageMiss = 0; stageOops = 0; goalAt = -1;
  spawnTimer = 0.25;
  for (const h of HOLES) { h.occ = null; }
  showBanner(stage.n + '탄 · ' + stage.name, '목표 ' + stage.goal.toLocaleString('ko-KR') + '점', '#ffd15b', 1.5);
  // 안내를 보여 주는 동안은 아무것도 안 나오고 시간도 안 간다.
  // 띠가 판 한가운데를 덮는데 그 밑에서 쥐가 나오면 못 본 채로 놓친다.
  intro = 1.5;
  refreshHud();
  stageStart();
}

// 탄이 끝났다. 목표를 채웠으면 다음 탄, 못 채웠으면 여기서 끝.
// 시간이 다 됐는데 목표를 못 채웠다.
function failStage() {
  showBanner('목표 미달', stageScore.toLocaleString('ko-KR') + ' / ' + stage.goal.toLocaleString('ko-KR') + '점', '#ff8f8f', 2.2);
  gameOver(true);
}

// 목표를 채운 채로 탄이 끝났다.
//
// 목표를 채우자마자 넘겨 보기도 했는데, 그러면 다들 '목표만 딱 채운
// 점수'로 수렴해서 순위표가 뭉개졌다(폭이 열두 배에서 세 배로). 탄은
// 끝까지 가되, 목표를 일찍 채운 만큼만 덤으로 준다.
function passStage() {
  // 목표를 얼마나 일찍 채웠는지. 남은 시간 1초에 10점.
  const timeBonus = Math.max(0, Math.round(goalAt)) * 10;

  // 통과 보너스. 한 번도 안 놓치고 안 헛쳤으면 크게 얹는다.
  // 무실수가 이어질수록 더 커진다 — 여기가 잘하는 사람이 벌어지는 자리다.
  const perfect = stageMiss === 0 && stageOops === 0;
  let bonus = Math.round(stage.goal * 0.3) + timeBonus;
  if (perfect) {
    perfectRun++;
    const mult = Math.min(2.5, 1 + 0.25 * (perfectRun - 1));
    bonus += Math.round(stage.goal * 0.4 * mult);
  } else {
    perfectRun = 0;
  }
  score += bonus;
  bump();

  const line = (perfect ? '무실수 ' + perfectRun + '탄째! ' : '')
    + (timeBonus ? Math.round(goalAt) + '초 남기고 달성 +' + timeBonus + ' · ' : '')
    + '모두 +' + bonus.toLocaleString('ko-KR');
  showBanner(stage.n + '탄 통과!', line, perfect ? '#ffd75e' : '#8fe6a0', 2.0);
  flash = 1; addShake(14); fanfare();
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * 6.283, sp = 60 + Math.random() * 220;
    parts.push({ x: W / 2, y: H * 0.42, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80,
                 life: 1, r: 2 + Math.random() * 4, col: perfect ? '#ffd75e' : '#8fe6a0' });
  }
  between = 1.6;                 // 잠깐 쉬었다가 다음 탄
  for (const h of HOLES) h.occ = null;
}

/* ---------------- 한 판 ---------------- */
function step(dt) {
  // 탄과 탄 사이. 축하 띠를 보여 주는 동안은 아무것도 안 나온다.
  if (between > 0) {
    between -= dt;
    if (between <= 0) beginStage(stageIdx + 1);
    return;
  }

  // 안내가 뜬 동안은 판이 멈춰 있다. 띠가 걷히고 나서 시작한다.
  if (intro > 0) { intro -= dt; return; }

  stageTime -= dt;
  // 탄은 끝까지 간다. 목표를 일찍 채워도 남은 시간은 점수를 더 벌 시간이다.
  // 여기가 잘하는 사람과 겨우 넘긴 사람이 갈리는 자리다.
  if (stageTime <= 0) {
    stageTime = 0;
    return stageScore >= stage.goal ? passStage() : failStage();
  }

  const t = Math.ceil(stageTime);
  if ($('#time').textContent !== String(t)) $('#time').textContent = t;
  $('#timeBox').classList.toggle('warn', stageTime <= 5 && stageScore < stage.goal);

  for (const h of HOLES) {
    const o = h.occ;
    if (!o) continue;
    o.t += dt;
    if (o.t >= o.dur) {
      // 놓쳤다. 쥐를 놓치면 연속이 끊긴다. 고양이가 그냥 들어간 건 잘한 거다.
      if (o.kind !== 'cat') {
        misses++; stageMiss++;
        if (combo >= 3) say('놓쳤다!', '#ff8f8f', 18, h);
        combo = 0;
      }
      h.occ = null;
    }
  }

  const up = HOLES.filter(h => h.occ).length;
  spawnTimer -= dt;
  if (spawnTimer <= 0 && up < maxUp()) {
    popOne();
    spawnTimer = gapTime() * (0.75 + Math.random() * 0.5);
  }
}

function tick(now) {
  raf = requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  // 맞는 순간 세상이 잠깐 멎는다. 때린 맛의 절반은 여기서 나온다.
  if (hitStop > 0) { hitStop -= dt; draw(); return; }
  stepFx(dt);
  if (playing && !over) step(dt);
  draw();
}

// 판 위에 이번 탄이 뭐고 목표까지 얼마나 왔는지 적는다.
function refreshHud() {
  $('#stageNo').textContent = stage.n + '탄';
  $('#stageName').textContent = stage.name;
  $('#goalNow').textContent = stageScore.toLocaleString('ko-KR');
  $('#goalNeed').textContent = stage.goal.toLocaleString('ko-KR');
  const frac = Math.min(1, stageScore / stage.goal);
  $('#goalFill').style.width = (frac * 100) + '%';
  $('#goalBar').classList.toggle('done', stageScore >= stage.goal);
}

function newGame() {
  score = 0; combo = 0; bestCombo = 0;
  hits = 0; misses = 0; oops = 0; golds = 0;
  perfectRun = 0; between = 0; intro = 0;
  texts = []; parts = []; paws = []; flash = 0; shake = 0; banner = null;
  rings = []; flying = []; hitStop = 0;
  for (const h of HOLES) { h.occ = null; h.shake = 0; }
  playing = true; over = false;
  $('#score').textContent = '0';
  $('#timeBox').classList.remove('warn');
  $('#startScreen').classList.add('hide');
  $('#overScreen').classList.add('hide');
  resetChase();
  beginStage(0);
  $('#time').textContent = STAGE_TIME;
}

function gameOver(failed) {
  over = true; playing = false;
  for (const h of HOLES) h.occ = null;
  window.saveBest();
  const total = hits + misses;
  const acc = total ? Math.round(hits / total * 100) : 0;
  const cleared = failed ? stage.n - 1 : stage.n;
  $('#overTitle').textContent = score >= best && score > 0 ? '최고 기록! 🏆' : (stage.n + '탄에서 끝');
  $('#overText').innerHTML =
    `<b>${score.toLocaleString('ko-KR')}점</b><br>` +
    `${cleared}탄까지 깼어요` +
    (failed ? ` · ${stage.n}탄 목표 ${stage.goal.toLocaleString('ko-KR')}점을 못 채웠어요` : '') + `<br>` +
    `잡은 쥐 ${hits}마리 · 정확도 ${acc}%<br>` +
    `최고 연속 ${bestCombo} · 황금쥐 ${golds}마리` +
    (oops ? `<br>고양이를 ${oops}번 때렸어요 🙀` : '');
  $('#overScreen').classList.remove('hide');
  stopBgm(); over_();
}

/* ---------------- 손가락 ---------------- */
function atCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const p = atCanvas(e);
  whack(p.x, p.y);
});

// 손가락 두 개로 칠 때 화면이 확대되던 것.
//
// 3탄부터 두 마리가 같이 나와서 양손으로 치게 되는데, iOS 는 두 손가락이
// 닿으면 그걸 확대 동작으로 받는다. 화면이 확대되면 앱의 게임 덮개가
// (position:fixed 라) 밀려서 뒤가 비치고, 손이 짚는 자리도 어긋난다.
//
// touch-action 으로는 못 막는다 — 그건 손가락이 판 위에 있을 때 얘기고,
// 확대는 문서 전체에 걸린다. iOS 만 쓰는 gesture 이벤트를 직접 막는다.
for (const t of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
}
// 판 위에서는 손가락이 몇 개든 기본 동작을 통째로 막는다.
cv.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
cv.addEventListener('touchmove',  (e) => e.preventDefault(), { passive: false });
addEventListener('keydown', (e) => {
  // 컴퓨터로도 해볼 수 있게 숫자판을 구멍에 맞춰 둔다
  const map = { Digit7:0, Digit8:1, Digit9:2, Digit4:3, Digit5:4, Digit6:5, Digit1:6, Digit2:7, Digit3:8,
                KeyQ:0, KeyW:1, KeyE:2, KeyA:3, KeyS:4, KeyD:5, KeyZ:6, KeyX:7, KeyC:8 };
  if (e.code in map) {
    e.preventDefault();
    const h = HOLES[map[e.code]];
    whack(h.x, h.y);
  }
});
$('#startBtn').onclick = newGame;
$('#retryBtn').onclick = newGame;

/* ---------------- 소리 ----------------
   파일 없이 그때그때 만들어 낸다. 소리 하나마다 새 AudioContext 를 만들면
   브라우저가 정한 개수에 금방 걸려서 소리가 통째로 끊긴다. 하나만 쓴다. */
let _ac = null;
function actx() {
  if (!_ac) { try { _ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (_ac.state === 'suspended') _ac.resume();
  return _ac;
}
function tone(freq, dur, type, vol, slideTo) {
  const ac = actx(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.14, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur + 0.02);
}
function pop()   { tone(420, 0.09, 'sine', 0.07, 700); }
// 퍽. 짧은 잡음 한 번이 맑은 소리보다 훨씬 때린 것처럼 들린다.
function punch(vol) {
  const ac = actx(); if (!ac) return;
  const n = Math.floor(ac.sampleRate * 0.06);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
  const g = ac.createGain(); g.gain.value = 0.30 * (vol || 1);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start();
}
// 연속으로 맞힐수록 소리가 반음씩 올라간다. 손맛이 눈에 안 보이게 붙는다.
function thud(step)  {
  const up = Math.pow(2, (step || 0) / 12);
  tone(180, 0.10, 'triangle', 0.16, 90);
  tone(640 * up, 0.07, 'square', 0.06);
}
function ding()  { [880, 1170, 1560].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'sine', 0.13), i * 70)); }
function churSound() { tone(720, 0.1, 'sine', 0.12, 980); }
function wrong() { tone(220, 0.20, 'sawtooth', 0.13, 110); }
function swish() { tone(1200, 0.05, 'sine', 0.03, 700); }
function over_() { [520, 440, 350, 260].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.11), i * 130)); }
function stageStart() { [520, 660, 780].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'square', 0.08), i * 90)); }
function fanfare()    { [660, 830, 990, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.20, 'triangle', 0.13), i * 95)); }
function startBgm() {}
function stopBgm() {}
addEventListener('pagehide', () => { try { _ac && _ac.close(); _ac = null; } catch (e) {} });

/* ---------------- 지금 1등 ----------------
   앱이 순위표 1등을 localStorage 에 적어 둔다(게임과 앱이 같은 사이트라
   함께 쓴다). 내가 1등이면 쫓을 사람이 없으니 안 띄운다. */
var topRec = null, passedTop = false;
try {
  var _t = JSON.parse(localStorage.getItem('dmc_top_paw') || 'null');
  if (_t && _t.score > 0 && !_t.mine) topRec = _t;
} catch (e) {}

function bumpChase(cur) {
  var el = document.getElementById('chase');
  if (!el) return;
  if (!topRec) { el.classList.add('hide'); return; }
  el.classList.remove('hide');
  if (!passedTop && cur > topRec.score) passedTop = true;
  el.classList.toggle('won', passedTop);
  if (passedTop) {
    document.getElementById('chaseWho').textContent = '👑';
    document.getElementById('chaseVal').textContent = '1등!';
    document.getElementById('chaseFill').style.width = '100%';
  } else {
    document.getElementById('chaseWho').textContent = topRec.name;
    document.getElementById('chaseVal').textContent = topRec.score.toLocaleString('ko-KR');
    document.getElementById('chaseFill').style.width =
      Math.min(100, cur / topRec.score * 100) + '%';
  }
}
function resetChase() { passedTop = false; bumpChase(0); }
bumpChase(0);

draw();
raf = requestAnimationFrame((t) => { lastT = t; tick(t); });
</script>
