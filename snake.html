<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0e0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="골디게임">
<title>스네이크</title>
<style>
  :root{
    --bg:#0e0f1a; --board:#181a2b; --cell:#20233a; --text:#e8e9f3; --muted:#9aa0c0;
    --accent:#7c6cff; --accent2:#ff6ca8; --green:#3ddc97; --line:rgba(255,255,255,.08);
  }
  /* 폰에서 빠르게 두 번 누르면 화면이 확대되고, 그러면서 글자가 잡혀
     '복사하기' 딱지가 떴다. 게임 화면에서 글자를 집을 일은 없으니
     아예 못 잡게 하고, 두 번 눌러 확대하는 것도 막는다.
     touch-action:manipulation 이 두 번 누르기 확대를 없애는 열쇠다. */
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none; user-select:none; -webkit-user-select:none}
  html,body{touch-action:manipulation; overscroll-behavior:none}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background:radial-gradient(900px 600px at 50% -10%,#241a3d 0%,transparent 55%),var(--bg);
    color:var(--text); min-height:100vh; padding:26px 16px 50px;
    display:flex; flex-direction:column; align-items:center}
  .back{align-self:flex-start; color:var(--muted); text-decoration:none; font-size:14px}
  .back:hover{color:var(--text)}
  .top{width:100%; max-width:440px; display:flex; justify-content:space-between;
    align-items:flex-end; margin:16px 0 18px}
  h1{font-size:44px; font-weight:900; letter-spacing:-2px;
    background:linear-gradient(120deg,#fff,#b9b0ff,#3ddc97);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .scores{display:flex; gap:10px}
  .score{background:var(--board); border:1px solid var(--line); border-radius:12px;
    padding:8px 16px; text-align:center; min-width:78px}
  .score .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px}
  .score .val{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums}
  /* 연속으로 먹는 동안만 뜬다. 이게 있어야 "곧장 가면 이득"이라는 걸 안다. */
  .comboBox{border-color:rgba(255,214,51,.45); min-width:0; padding:8px 11px}
  .comboBox.hide{display:none}
  .comboBox .lbl, .comboBox .val{color:#ffd633}
  /* 배수가 붙으면 글자가 길어진다. 그대로 두면 제목 '스네이크'가 두 줄로
     접혔다. 이 칸만 글자를 줄이고 한 줄로 붙여 쓴다. */
  .comboBox .val{font-size:18px; white-space:nowrap}
  .comboBox .val i{font-style:normal; font-size:13px; opacity:.9}
  h1{white-space:nowrap}
  .bar{width:100%; max-width:440px; display:flex; justify-content:space-between;
    align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  .bar .left{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px}
  .speed-sel{display:flex; gap:6px}
  .speed-sel button{background:#20233a; color:var(--muted); border:1px solid var(--line);
    border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;
    transition:all .2s}
  .speed-sel button.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  .bar .actions{display:flex; gap:8px; margin-left:auto}
  .bar .actions button{background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:10px 16px; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap;
    transition:filter .2s}
  .bar .actions button:hover{filter:brightness(1.1)}
  .board-wrap{position:relative; width:100%; max-width:440px}
  canvas{width:100%; height:auto; background:var(--board); border-radius:18px;
    display:block; touch-action:none}
  .overlay{position:absolute; inset:0; background:rgba(14,15,26,.82); border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    z-index:5; text-align:center; padding:20px}
  .overlay.hide{display:none}
  .overlay h2{font-size:34px; font-weight:900}
  .overlay p{color:var(--muted); font-size:15px}
  .overlay button{background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff;
    border:none; border-radius:12px; padding:13px 30px; font-weight:700; font-size:16px; cursor:pointer}
  .hint{color:var(--muted); font-size:13px; margin-top:18px; text-align:center}
  /* 방향키 — 노트북 자판의 방향키와 같은 뒤집힌 T 자로 놓는다.
     조이스틱을 쓰다가 바꿨다. 미는 게임이 아니라 넷 중 하나를 고르는
     게임이라, 누를 자리가 눈에 보이는 편이 손이 덜 헤맨다. 스틱은
     45° 언저리에서 축이 뒤집히는 걸 막느라 문턱을 두 개나 둬야 했는데,
     버튼은 누른 게 곧 방향이라 그럴 일이 없다.

     진짜 button 이라 누르면 초점이 게임 안으로 들어온다. 그래서 한 번
     누른 뒤로는 노트북 자판의 방향키도 같이 먹는다. */
  .keys{display:none; flex-direction:column; align-items:center; gap:8px;
    margin-top:14px; touch-action:manipulation}
  .krow{display:flex; gap:8px}
  .keys button{width:66px; height:56px; background:var(--board); color:var(--text);
    border:1px solid var(--line); border-radius:12px; line-height:1;
    font-size:20px; font-weight:700; cursor:pointer;
    user-select:none; -webkit-user-select:none; touch-action:manipulation}
  .keys button:active{background:var(--accent); border-color:var(--accent); color:#fff}
  @media (hover:none) and (pointer:coarse){ .keys{display:flex} }
  @media (max-width:640px){ .keys{display:flex} }

  /* 폰에서는 스크롤 없이 한 화면에. 앱 안에서는 위 막대만큼 더 좁아지니
     남는 높이에 맞춰 판을 줄인다. */
  @media (max-width:640px){
    body{
      height:100dvh; min-height:0; overflow:hidden;
      padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
      gap:6px;
    }
    .top h1{font-size:19px; margin:0}
    .top,.bar{flex:none; max-width:none}
    .board-wrap{flex:1; min-height:0; width:100%; max-width:none;
                display:flex; align-items:center; justify-content:center}
    /* 판은 정사각형이다. 높이만 100% 로 잡으면 가로가 막혀서 찌그러진다. */
    /* 판은 정사각형이다. 높이를 100% 로 못박으면 가로가 막혀도 안 줄어들어
       찌그러진다. 가로세로 한계만 주고 비율은 스스로 맞추게 둔다. */
    canvas{width:auto; height:auto; aspect-ratio:1/1;
           max-width:100%; max-height:100%; margin:0}
    .hint{display:none}
    .keys{flex:none; margin-top:2px; gap:6px}
    .krow{gap:6px}
    .keys button{width:62px; height:50px; font-size:19px}
  }
  /* 더 낮은 화면에서는 조이스틱과 머리글을 한 번 더 줄인다 */
  @media (max-width:640px) and (max-height:700px){
    .top h1{font-size:16px}
    .keys button{width:58px; height:43px; font-size:17px}
  }

  /* 지금 1등을 쫓는 띠.
     앱에서 게임을 켜면 순위표 1등이 localStorage 로 넘어온다. 혼자 파일만
     열었을 때는 넘어올 게 없어서 이 띠가 아예 안 나온다.
     1등 점수는 못박아 둔다 — 남은 점수를 세면 숫자가 줄면서 쫓기는
     기분이 드는데, 목표를 걸어 두고 올라가는 편이 낫다. */
  .chase{width:100%; max-width:440px; display:flex; align-items:center; gap:9px;
    margin:0 auto 12px; font-size:11.5px; color:#ff9fbb}
  .chase.hide{display:none}
  .chase .who{font-weight:700; white-space:nowrap; max-width:34%;
    overflow:hidden; text-overflow:ellipsis}
  .chase .bar{flex:1; height:5px; border-radius:99px;
    background:rgba(255,255,255,.10); overflow:hidden}
  .chase .bar i{display:block; height:100%; width:0;
    background:linear-gradient(90deg,#ff8fb0,#ffd85b); transition:width .35s ease}
  .chase .val{font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap}
  .chase.won{color:#ffd85b}
  .chase.won .bar i{background:#ffd85b; animation:chasePulse 1.1s ease-in-out infinite}
  @keyframes chasePulse{50%{opacity:.4}}
</style>
</head>
<body>
<a class="back" href="index.html">← 골디 게임</a>
<div class="top">
  <h1>스네이크</h1>
  <div class="scores">
    <div class="score"><div class="lbl">점수</div><div class="val" id="score">0</div></div>
    <div class="score"><div class="lbl">최고</div><div class="val" id="best">0</div></div>
    <div class="score comboBox hide" id="comboBox">
      <div class="lbl">연속</div><div class="val" id="comboVal">0</div>
    </div>
  </div>
</div>
<div class="chase hide" id="chase">
  <span class="who" id="chaseWho">1등</span>
  <span class="bar"><i id="chaseFill"></i></span>
  <span class="val" id="chaseVal">0</span>
</div>

<div class="bar">
  <div class="left">
    속도
    <div class="speed-sel" id="speedSel">
      <button data-ms="140">느림</button>
      <button data-ms="95" class="active">보통</button>
      <button data-ms="60">빠름</button>
    </div>
  </div>
  <div class="actions">
    <button id="restart">새 게임</button>
  </div>
</div>
<div class="board-wrap">
  <canvas id="cv" width="420" height="420"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="ovTitle">스네이크 🐍</h2>
    <p id="ovText">화살표 키 · WASD · 스와이프로 시작하세요</p>
    <button id="startBtn">시작</button>
  </div>
</div>
<p class="hint">화살표 · WASD · 스와이프로 조작 &nbsp;·&nbsp; Space 일시정지</p>
<div class="keys" id="keys">
  <div class="krow"><button type="button" data-d="u" aria-label="위">▲</button></div>
  <div class="krow">
    <button type="button" data-d="l" aria-label="왼쪽">◀</button>
    <button type="button" data-d="d" aria-label="아래">▼</button>
    <button type="button" data-d="r" aria-label="오른쪽">▶</button>
  </div>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const GRID = 21;                       // cells per side
const SIZE = cv.width / GRID;          // px per cell
const $ = s => document.querySelector(s);

let snake, dir, nextDir, food, score, speed = 95, alive = false, paused = false, timer = null;
let started = false;

// ── 점수를 더 딸 수 있는 것들 ─────────────────────────────────────────
// 먹이 하나에 10점 고정이면, 잘 모는 사람과 그냥 오래 도는 사람이
// 구분되지 않는다. 세 가지를 더한다.
//   길이   — 길어질수록 한 입이 더 크다
//   연속   — 헤매지 않고 곧장 가서 먹으면 이어진다
//   황금먹이 — 가끔 나타났다 사라진다. 갈지 말지가 판단이 된다
let combo = 0;          // 곧장 가서 먹은 횟수
let steps = 0;          // 지금까지 움직인 칸 수
let deadline = 0;       // 이 안에 먹으면 연속으로 친다
let gold = null;        // {x,y,until}
let eaten = 0;          // 먹은 개수 — 황금먹이 나올 때를 센다

// ── 눈에 보이는 것들 ─────────────────────────────────────────────────
let bits = [];          // 튀는 조각
let texts = [];         // 떠오르는 점수
let shake = 0, flash = 0, chomp = 0;
let raf = 0;

// 길어질수록 한 입이 커진다. 여섯 칸마다 2점씩.
const baseVal = () => 10 + Math.floor(snake.length / 6) * 2;

/* ---------------- 길이 배수 ----------------
   캣트리스의 구간 배수와 같은 자리다. 이 게임에는 그게 없어서, 오래
   살아남아도 한 입 값이 더디게만 컸다 — 예순 칸을 키워도 30점이다.

   이제 열 칸마다 배수가 0.75 씩 오른다. 스무 칸에 ×3.25, 쉰 칸에 ×5.5,
   백 칸에 ×9.25. 뱀이 길수록 판이 좁아지고 제 몸에 갇히기 쉬우니,
   그 위험을 값으로 돌려준다.

   바닥이 1 이 아니라 2.5 인 건, 스무 칸도 못 가고 끝나는 사람에게도
   배수를 쥐여 주려고 그런 것이다. 1 에서 시작했더니 열 칸에서 죽은
   사람은 배수가 통째로 남의 일이었다. 아래 이정표 덤에도 같은 2.5 를
   곱해 둔다 — 점수의 절반 넘게가 이정표라, 거기 안 곱하면 배수를
   올려도 총점이 꿈쩍을 안 한다. */
const lenMult = () => 2.5 + Math.max(0, Math.floor((snake.length - 10) / 10)) * 0.75;

/* ---------------- 연속 배수 ----------------
   예전엔 연속에 3점씩 덤을 얹고 열 번에서 끊었다. 그래서 잘하는 사람도
   한 입에 서른 점이 천장이었다. 이제 덤이 아니라 배수다.

   아래를 촘촘히 깔아서 둘만 이어도 뭔가 붙고, 위로 갈수록 간격을 벌려
   오래 이은 사람만 큰 배수에 닿는다. 황금먹이에도 그대로 곱해지니
   연속을 살려 둔 채 황금을 먹는 게 이 게임에서 제일 큰 한 방이다. */
const COMBO_TIERS = [
  { at: 2,  m: 1.2 },
  { at: 4,  m: 1.5 },
  { at: 7,  m: 2   },
  { at: 11, m: 2.5 },
  { at: 16, m: 3   },
  { at: 22, m: 4   },
  { at: 30, m: 5   },
  { at: 40, m: 6.5 },
  { at: 55, m: 8   },
];
function comboMult(){
  let m = 1;
  for(const t of COMBO_TIERS){ if(combo >= t.at) m = t.m; else break; }
  return m;
}

// 길이 이정표. 열 칸마다 한 번씩, 길수록 크게 준다.
// 오래 살아남는 것 자체에도 값을 쳐 줘야 길게 끌고 갈 이유가 생긴다.
let markHit = 0;
let foodBorn = 0;      // 이 먹이가 놓인 시각. 남은 시간 테두리를 그릴 때 쓴다.
let best = +(localStorage.getItem('snake_best') || 0);
// 최고점은 판이 끝났을 때만 적는다. 노는 도중에 적으면 바깥 앱이 그걸
// 5초마다 읽어다 올려서, 한 판에 순위 알림이 몇 번씩 울린다.
// 바깥에서 게임을 닫을 때도 불러 주니(games.js), 하던 판이 날아가지도 않는다.
window.saveBest = function(){ if(best>0) localStorage.setItem('snake_best', best); };
addEventListener('pagehide', window.saveBest);

$('#best').textContent = best;

const DIRS = {u:{x:0,y:-1}, d:{x:0,y:1}, l:{x:-1,y:0}, r:{x:1,y:0}};
const OPP = {u:'d', d:'u', l:'r', r:'l'};

function freeCell(){
  let p;
  do { p = {x:(Math.random()*GRID)|0, y:(Math.random()*GRID)|0}; }
  while(snake.some(s => s.x===p.x && s.y===p.y)
        || (food && food.x===p.x && food.y===p.y)
        || (gold && gold.x===p.x && gold.y===p.y));
  return p;
}
function placeFood(){
  food = freeCell();
  // 머리에서 먹이까지 걸어야 하는 칸 수에 여유를 더한 만큼이 제한 시간이다.
  // 고정 시간으로 하면 먼 먹이가 나왔을 때 억울하다.
  const d = Math.abs(food.x - snake[0].x) + Math.abs(food.y - snake[0].y);
  // 걸어가야 하는 칸 수에 여유를 더한 만큼이 제한이다. 고정으로 하면
  // 먼 먹이가 나왔을 때 억울하다. 연속이 길어질수록 여유를 조금씩 줄여
  // 뒤로 갈수록 조여든다 — 안 그러면 잘하는 사람은 영영 안 끊긴다.
  const slack = Math.max(6, Math.round(GRID * 0.7) - combo);
  foodBorn = steps;
  deadline = steps + d + slack;
}
function initGame(){
  const cx = (GRID/2)|0;
  snake = [{x:cx-1,y:cx}, {x:cx-2,y:cx}, {x:cx-3,y:cx}];
  dir = 'r'; nextDir = 'r'; score = 0;
  combo = 0; steps = 0; gold = null; eaten = 0; markHit = 0; foodBorn = 0;
  bits = []; texts = []; shake = 0; flash = 0; chomp = 0;
  $('#score').textContent = 0;
  resetChase();
  showCombo();
  placeFood();
  draw();
}
// 연속이 살아 있는 동안만 점수 옆에 뜬다.
function showCombo(){
  const el = $('#comboBox');
  if(!el) return;
  el.classList.toggle('hide', combo < 2);
  if(combo >= 2){
    const m = comboMult();
    $('#comboVal').innerHTML = combo + (m > 1 ? '<i>×'+m+'</i>' : '');
  }
}
// 먹은 자리에서 조각이 튀고 점수가 떠오른다.
function burst(x, y, color, n){
  if(bits.length > 160) bits.splice(0, bits.length-160);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 0.5 + Math.random()*2.2;
    bits.push({x:(x+0.5)*SIZE, y:(y+0.5)*SIZE,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:1, size:SIZE*(0.08+Math.random()*0.14), color});
  }
}
function say(x, y, str, color, size){
  if(texts.length > 14) texts.splice(0, texts.length-14);
  texts.push({x:(x+0.5)*SIZE, y:(y+0.2)*SIZE, str, color, size, life:1});
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function draw(){
  ctx.save();
  if(shake > 0.4){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    shake *= 0.86;
  }
  ctx.clearRect(-20,-20,cv.width+40,cv.height+40);
  // subtle grid dots
  ctx.fillStyle = 'rgba(255,255,255,.03)';
  for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++){
    ctx.fillRect(i*SIZE+SIZE/2-1, j*SIZE+SIZE/2-1, 2, 2);
  }
  const t = performance.now()/1000;
  // food — 숨쉬듯 커졌다 작아진다. 가만히 있는 점보다 눈에 잘 띈다.
  const pulse = 1 + Math.sin(t*5)*0.09;
  const fx = food.x*SIZE, fy = food.y*SIZE;

  // 먹이를 둘러싼 시계.
  //
  // 제한 시간은 원래도 있었는데 화면에 안 나와서, 연속이 왜 끊겼는지
  // 알 수가 없었다. 남은 만큼 테두리가 줄어드는 걸 보여 준다. 시간은
  // 초가 아니라 '몇 칸 움직일 동안'이라, 속도를 뭘로 고르든 조건이 같다.
  const fleft = Math.max(0, deadline - steps);
  const ffrac = Math.max(0, Math.min(1, fleft / Math.max(1, deadline - foodBorn)));
  if(ffrac > 0){
    ctx.save();
    ctx.translate(fx+SIZE/2, fy+SIZE/2);
    ctx.strokeStyle = ffrac > 0.35 ? '#7de8ff' : '#ffd633';   // 얼마 안 남으면 노랗게
    ctx.lineWidth = Math.max(2.5, SIZE*0.16);
    ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, SIZE*0.48, -Math.PI/2, -Math.PI/2 + ffrac*Math.PI*2);
    ctx.stroke();
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  ctx.save();
  ctx.translate(fx+SIZE/2, fy+SIZE/2); ctx.scale(pulse,pulse);
  ctx.fillStyle = ffrac > 0 ? '#ff6ca8' : '#8a5f74';   // 시간이 지나면 빛이 죽는다
  ctx.shadowColor = '#ff6ca8'; ctx.shadowBlur = ffrac > 0 ? 12 : 0;
  roundRect(-SIZE*0.3, -SIZE*0.3, SIZE*0.6, SIZE*0.6, SIZE*0.2); ctx.fill();
  ctx.restore();
  ctx.shadowBlur = 0;
  // 황금먹이 — 사라질 때가 가까우면 빠르게 깜빡인다
  if(gold){
    const left = gold.until - steps;
    const blink = left < 12 ? (Math.sin(t*22) > -0.2) : true;
    if(blink){
      const gp = 1 + Math.sin(t*8)*0.14;
      ctx.save();
      ctx.translate((gold.x+0.5)*SIZE, (gold.y+0.5)*SIZE); ctx.rotate(Math.sin(t*3)*0.25); ctx.scale(gp,gp);
      ctx.fillStyle = '#ffd633';
      ctx.shadowColor = '#ffd633'; ctx.shadowBlur = 18;
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const a = (i/10)*Math.PI*2, r = i%2 ? SIZE*0.16 : SIZE*0.36;
        ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0;
    }
  }
  // snake
  snake.forEach((s,i)=>{
    const t = i/Math.max(snake.length-1,1);
    // gradient head->tail: purple to green
    const c1=[124,108,255], c2=[61,220,151];
    const r = Math.round(c1[0]+(c2[0]-c1[0])*t);
    const g = Math.round(c1[1]+(c2[1]-c1[1])*t);
    const b = Math.round(c1[2]+(c2[2]-c1[2])*t);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    // 연속으로 먹는 동안은 몸에 빛이 돈다. 이어지고 있다는 걸 몸으로 보여 준다.
    if(combo >= 2){
      const w = (Math.sin(t*7 - i*0.5)+1)/2;
      ctx.shadowColor = `rgba(255,214,51,${0.25+w*0.5})`;
      ctx.shadowBlur = SIZE*0.5;
    }
    // 막 먹었으면 머리가 한 번 씹는다
    const pad = i===0 ? 1 - chomp*2.5 : 2;
    roundRect(s.x*SIZE+pad, s.y*SIZE+pad, SIZE-pad*2, SIZE-pad*2, SIZE*0.3);
    ctx.fill();
    ctx.shadowBlur = 0;
    // eyes on head
    if(i===0){
      ctx.fillStyle = '#0e0f1a';
      const d = DIRS[dir], cx0 = s.x*SIZE+SIZE/2, cy0 = s.y*SIZE+SIZE/2;
      const ex = d.x*SIZE*0.18, ey = d.y*SIZE*0.18;
      const px = -d.y*SIZE*0.2, py = d.x*SIZE*0.2; // perpendicular
      ctx.beginPath(); ctx.arc(cx0+ex+px, cy0+ey+py, SIZE*0.09, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx0+ex-px, cy0+ey-py, SIZE*0.09, 0, 7); ctx.fill();
    }
  });

  // 튀는 조각
  for(let i=bits.length-1;i>=0;i--){
    const p = bits[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.035;
    if(p.life <= 0){ bits.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*p.life, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 떠오르는 점수
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(let i=texts.length-1;i>=0;i--){
    const x = texts[i];
    x.y -= 0.9; x.life -= 0.022;
    if(x.life <= 0){ texts.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(1, x.life*1.7);
    ctx.font = `900 ${x.size}px -apple-system, system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(14,15,26,.8)';
    ctx.strokeText(x.str, x.x, x.y);
    ctx.fillStyle = x.color; ctx.fillText(x.str, x.x, x.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';

  // 황금먹이를 먹었을 때 판 테두리가 번쩍인다
  if(flash > 0){
    ctx.strokeStyle = `rgba(255,214,51,${flash})`;
    ctx.lineWidth = 5 + flash*10;
    ctx.strokeRect(ctx.lineWidth/2, ctx.lineWidth/2,
                   cv.width-ctx.lineWidth, cv.height-ctx.lineWidth);
    flash = Math.max(0, flash - 0.035);
  }
  if(chomp > 0) chomp = Math.max(0, chomp - 0.09);
  ctx.restore();
}
// 조각과 글씨가 부드럽게 흐르도록 매 프레임 다시 그린다.
// 예전엔 한 칸 움직일 때(95ms)만 그려서 효과가 뚝뚝 끊겼다.
function render(){ draw(); raf = requestAnimationFrame(render); }
function step(){
  dir = nextDir;
  const d = DIRS[dir];
  const head = {x: snake[0].x + d.x, y: snake[0].y + d.y};
  // wall collision
  if(head.x<0 || head.y<0 || head.x>=GRID || head.y>=GRID){ return gameOver(); }
  // self collision (allow moving into current tail cell since it will move—but simpler: check body)
  if(snake.some((s,i)=> i<snake.length-1 && s.x===head.x && s.y===head.y)){ return gameOver(); }
  steps++;
  snake.unshift(head);

  // 황금먹이 — 시간이 지나면 사라진다
  if(gold && steps > gold.until){
    burst(gold.x, gold.y, '#6b5a1f', 6);
    gold = null;
  }
  let ate = false;

  if(gold && head.x===gold.x && head.y===gold.y){
    // 황금먹이에도 연속 배수와 길이 배수가 곱해진다. 여기가 제일 큰 한 방이다.
    const m = comboMult(), lm = lenMult();
    const v = Math.round(60 * m * lm);
    score += v; ate = true;
    say(gold.x, gold.y, '+'+v + (m > 1 ? ' ×'+m : ''), '#ffd633', SIZE*0.62);
    burst(gold.x, gold.y, '#ffd633', 18);
    flash = 1; shake = 9; chomp = 1;
    goldSound();
    gold = null;
  }

  if(head.x===food.x && head.y===food.y){
    const base = baseVal();
    // 헤매지 않고 곧장 왔으면 이어진다
    if(steps <= deadline) combo++; else combo = 0;
    const m = comboMult(), lm = lenMult();
    const gain = Math.round(base * m * lm);
    score += gain;
    ate = true; chomp = 1;
    say(food.x, food.y, '+'+gain + (m > 1 ? ' ×'+m : ''), m > 1 ? '#ffd633' : '#ff9ec8', SIZE*0.55);
    burst(food.x, food.y, '#ff6ca8', 12);
    eatSound(combo);
    if(combo >= 2){ shake = Math.max(shake, 3); }
    // 배수가 한 칸 오르는 순간만 알린다. 매번 띄우면 화면이 시끄럽다.
    if(COMBO_TIERS.some(t => t.at === combo)){
      say(food.x, Math.max(1, food.y - 1), combo+'연속 ×'+m, '#ffd633', SIZE*0.5);
      shake = Math.max(shake, 6);
    }
    eaten++;
    // 길이 이정표 — 열 칸마다. 길수록 크게 준다.
    const mark = Math.floor(snake.length / 10) * 10;
    if(mark > markHit && mark >= 10){
      markHit = mark;
      // 이정표도 길수록 크게. 다만 예전(열 배)보다 낮아지는 구간이
      // 없도록 바닥을 깔아 둔다 — 열 칸에서만 제곱 쪽이 더 작다.
      const b = Math.round(Math.max(mark * 10, mark * mark / 2) * 2.5);
      score += b;
      say(head.x, Math.max(1, head.y - 2), mark+'칸! +'+b, '#8fd9ff', SIZE*0.55);
      burst(head.x, head.y, '#8fd9ff', 14);
      shake = Math.max(shake, 8); flash = Math.max(flash, 0.6);
    }
    // 다음 먹이를 먼저 놓는다. 황금먹이 자리를 정하려면 먹이가 어디인지
    // 알아야 하고, placeFood 가 제한 시간을 다시 매기기 때문이다.
    placeFood();

    // 네 번마다 황금먹이가 하나 나타난다.
    //
    // 처음엔 황금먹이가 함정이었다. 들렀다 가면 먹이 제한 시간을 넘겨서
    // 연속이 끊겼고, 재 보니 황금을 쫓는 쪽이 오히려 점수가 낮았다
    // (6,254 → 4,235). 그래서 돌아가는 만큼 제한 시간을 늘려 준다.
    // 이제 황금먹이는 이득이되, 그만큼 몸이 길어지는 위험은 그대로다.
    if(eaten % 4 === 0 && !gold){
      const p = freeCell();
      gold = {x:p.x, y:p.y, until: steps + 46};
      const h = snake[0];
      const man = (a,b) => Math.abs(a.x-b.x) + Math.abs(a.y-b.y);
      const detour = man(h,p) + man(p,food) - man(h,food);
      deadline += Math.max(0, detour);
      say(p.x, p.y, '황금!', '#ffd633', SIZE*0.5);
      appearSound();
    }
  }

  if(ate){
    $('#score').textContent = score;
    bumpChase(score);
    if(score>best){ best=score; $('#best').textContent = best; }
    showCombo();
  } else {
    snake.pop();
  }
}
function loop(){ if(alive && !paused) step(); }
function start(){
  if(alive) return;
  initGame(); alive = true; paused = false; started = true;
  hideOverlay();
  clearInterval(timer); timer = setInterval(loop, speed);
}
function gameOver(){
  alive = false; clearInterval(timer);
  window.saveBest();
  blip(180);
  showOverlay('게임 오버', `점수 ${score}${score>=best&&score>0?' · 최고 기록! 🎉':''}`, '다시 하기');
}
function togglePause(){
  if(!alive) return;
  paused = !paused;
  if(paused) showOverlay('일시정지', `점수 ${score}`, '계속하기');
  else hideOverlay();
}
function showOverlay(title, text, btn){
  $('#ovTitle').textContent = title; $('#ovText').textContent = text;
  $('#startBtn').textContent = btn;
  $('#overlay').classList.remove('hide');
}
function hideOverlay(){ $('#overlay').classList.add('hide'); }

function setDir(nd){
  if(!alive){ if(nd) start(); return; }
  if(paused) return;
  if(nd && nd !== OPP[dir] && nd !== dir) nextDir = nd;
}
// 소리통은 하나만 만들어 돌려쓴다. 예전엔 소리를 낼 때마다 새로 만들어서,
// 브라우저가 정해 둔 개수 한도에 걸리면 어느 순간부터 조용해졌다.
let _ac = null;
function actx(){
  if(!_ac){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    _ac = new AC();
  }
  if(_ac.state === 'suspended') _ac.resume();
  return _ac;
}
function tone(freq, t0, dur, type, vol){
  const ac = actx(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
function blip(freq){
  const ac = actx(); if(!ac) return;
  try{ tone(freq, ac.currentTime, 0.12, 'square', 0.08); }catch(e){}
}
// 먹을 때. 이어서 먹을수록 음이 한 칸씩 올라간다.
function eatSound(n){
  const ac = actx(); if(!ac) return;
  try{
    const f = 660 * Math.pow(2, Math.min(n,12)*2/12);
    tone(f, ac.currentTime, 0.12, 'triangle', 0.07);
    tone(f*2, ac.currentTime+0.004, 0.08, 'sine', 0.025);
  }catch(e){}
}
function goldSound(){
  const ac = actx(); if(!ac) return;
  try{
    const t0 = ac.currentTime;
    [784, 988, 1175, 1568].forEach((f,i)=> tone(f, t0+i*0.06, 0.3, 'triangle', 0.06));
  }catch(e){}
}
function appearSound(){
  const ac = actx(); if(!ac) return;
  try{ const t0 = ac.currentTime;
    tone(1319, t0, 0.1, 'sine', 0.04); tone(1760, t0+0.07, 0.14, 'sine', 0.035);
  }catch(e){}
}

// ---- input ----
const keymap = {ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',
  w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'};
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault();
    if(!started||!alive){ start(); } else togglePause(); return; }
  // 한글 입력 상태에서는 e.key 가 'ㅁ','ㄴ' 처럼 들어와서 WASD 가 안 먹는다.
  // e.code 는 자판의 물리적 위치라 한글이든 영문이든 늘 같다.
  const byCode = {ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',
                  KeyW:'u',KeyS:'d',KeyA:'l',KeyD:'r'};
  const nd = byCode[e.code] || keymap[e.key];
  if(nd){ e.preventDefault(); setDir(nd); }
});
$('#startBtn').onclick = ()=>{ if(paused){ togglePause(); } else start(); };
$('#restart').onclick = ()=>{ clearInterval(timer); alive=false; start(); };

// speed selector
$('#speedSel').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  speed = +b.dataset.ms;
  document.querySelectorAll('.speed-sel button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  if(alive && !paused){ clearInterval(timer); timer = setInterval(loop, speed); }
});

// 방향키 버튼
// 누른 게 곧 방향이다. 스틱처럼 미는 거리를 재지 않으니 문턱도 없다.
//
// pointerdown 에서 잡는다 — click 까지 기다리면 손을 뗄 때까지 늦는다.
// preventDefault 는 부르지 않는다. 그걸 부르면 초점이 게임으로 안 넘어와서
// 자판 방향키가 죽는다(스틱이 그랬다). 겹눌러도 두 번 세는 일이 없게
// 그 손가락 하나만 본다.
(function(){
  const box = document.getElementById('keys');
  if(!box) return;
  const held = new Set();
  box.addEventListener('pointerdown', e=>{
    const b = e.target.closest('button[data-d]');
    if(!b || held.has(e.pointerId)) return;
    held.add(e.pointerId);
    setDir(b.dataset.d);
  });
  const drop = e => held.delete(e.pointerId);
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>box.addEventListener(ev, drop));
})();

// swipe
let sx, sy;
cv.addEventListener('touchstart', e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; }, {passive:true});
cv.addEventListener('touchend', e=>{
  if(sx==null) return; const t=e.changedTouches[0];
  const dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20){ if(!alive) start(); sx=sy=null; return; }
  if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?'r':'l'); else setDir(dy>0?'d':'u');
  sx=sy=null;
}, {passive:true});

initGame();
render();          // 매 프레임 다시 그린다 — 효과가 끊기지 않게

/* ---------------- 지금 1등 ----------------
   앱이 순위표 1등을 localStorage 에 적어 둔다(게임과 앱이 같은 사이트라
   함께 쓴다). 혼자 점수를 올리는 게 아니라 누군가를 쫓고 있다는 게
   보여야 재미가 붙는다. 내가 1등이면 쫓을 사람이 없으니 안 띄운다.
   var 와 function 으로 적은 건 이 토막이 파일 맨 끝에 있어서다 —
   위쪽 어디에서 불러도 닿는다. */
var topRec = null, passedTop = false;
try {
  var _t = JSON.parse(localStorage.getItem('dmc_top_snake') || 'null');
  // 내가 1등이어도 띄운다. 예전엔 숨겼는데, 그러면 1등인 사람은 게임 내내
  // 아무 목표도 없이 논다. 내 기록도 넘어야 할 벽이다.
  if (_t && _t.score > 0) topRec = _t;
} catch (e) {}

function bumpChase(cur){
  var el = document.getElementById('chase');
  if (!el) return;
  if (!topRec) { el.classList.add('hide'); return; }
  el.classList.remove('hide');
  if (!passedTop && cur > topRec.score) passedTop = true;
  el.classList.toggle('won', passedTop);
  if (passedTop) {
    document.getElementById('chaseWho').textContent = '👑';
    document.getElementById('chaseVal').textContent = topRec.mine ? '기록 갱신!' : '1등!';
    document.getElementById('chaseFill').style.width = '100%';
  } else {
    document.getElementById('chaseWho').textContent = topRec.mine ? '👑 내 기록' : topRec.name;
    document.getElementById('chaseVal').textContent = topRec.score.toLocaleString('ko-KR');
    document.getElementById('chaseFill').style.width =
      Math.min(100, cur / topRec.score * 100) + '%';
  }
}
function resetChase(){ passedTop = false; bumpChase(0); }
bumpChase(0);
</script>
