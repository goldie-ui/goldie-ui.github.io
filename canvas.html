<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하모노그래프 캔버스</title>
<style>
  :root{--bg:#0b0c14; --panel:rgba(24,26,43,.82); --text:#e8e9f3; --muted:#9aa0c0;
    --accent:#7c6cff; --line:rgba(255,255,255,.1)}
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden}
  canvas{display:block; position:fixed; inset:0; cursor:crosshair}
  .back{position:fixed; top:16px; left:18px; color:var(--muted); text-decoration:none;
    font-size:14px; z-index:10; background:var(--panel); padding:7px 12px; border-radius:10px;
    backdrop-filter:blur(8px)}
  .back:hover{color:var(--text)}
  .panel{position:fixed; top:14px; right:14px; z-index:10; background:var(--panel);
    backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:18px;
    padding:18px; width:230px; display:flex; flex-direction:column; gap:14px}
  .panel h1{font-size:16px; font-weight:800}
  .row{display:flex; flex-direction:column; gap:6px}
  .row label{font-size:12px; color:var(--muted); display:flex; justify-content:space-between}
  input[type=range]{width:100%; accent-color:var(--accent)}
  .palettes{display:flex; gap:8px; flex-wrap:wrap}
  .sw{width:34px; height:26px; border-radius:8px; cursor:pointer; border:2px solid transparent}
  .sw.active{border-color:#fff}
  .btns{display:flex; gap:8px}
  .btns button{flex:1; background:#20233a; color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:10px; cursor:pointer; font-size:13px; font-weight:600;
    transition:background .2s}
  .btns button:hover{background:#2a2e4d}
  .btns button.accent{background:var(--accent); border-color:var(--accent)}
  .hint{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:10;
    color:var(--muted); font-size:13px; background:var(--panel); padding:8px 16px;
    border-radius:100px; backdrop-filter:blur(8px); pointer-events:none;
    transition:opacity .6s}
</style>
</head>
<body>
<a class="back" href="index.html">← 플레이그라운드</a>
<canvas id="c"></canvas>
<div class="panel">
  <h1>🎨 하모노그래프</h1>
  <div class="row">
    <label>번짐 <span id="vSpread">14</span></label>
    <input id="spread" type="range" min="2" max="40" value="14">
  </div>
  <div class="row">
    <label>속도 <span id="vSpeed">6</span></label>
    <input id="speed" type="range" min="1" max="20" value="6">
  </div>
  <div class="row">
    <label>잔상</label>
    <input id="fade" type="range" min="0" max="20" value="4">
  </div>
  <div class="row">
    <label>색 팔레트</label>
    <div class="palettes" id="pals"></div>
  </div>
  <div class="btns">
    <button id="clear">지우기</button>
    <button id="save" class="accent">저장</button>
  </div>
</div>
<div class="hint" id="hint">마우스를 움직이거나 화면을 드래그해 그려보세요</div>

<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W,H;
function resize(){
  W = c.width = window.innerWidth; H = c.height = window.innerHeight;
  ctx.fillStyle = '#0b0c14'; ctx.fillRect(0,0,W,H);
}
resize(); window.addEventListener('resize', resize);

const palettes = {
  aurora:['#7c6cff','#4dd0e1','#3ddc97','#ff6ca8'],
  sunset:['#ff9e64','#ff6ca8','#c56cff','#ffd166'],
  ocean:['#2196f3','#00e5ff','#1de9b6','#7c6cff'],
  mono:['#e8e9f3','#9aa0c0','#7c6cff','#ffffff'],
};
let pal = palettes.aurora, hueT = 0;

const palsEl = document.getElementById('pals');
Object.entries(palettes).forEach(([name,cols],i)=>{
  const sw = document.createElement('div');
  sw.className = 'sw' + (i===0?' active':'');
  sw.style.background = `linear-gradient(120deg,${cols.join(',')})`;
  sw.onclick = ()=>{ pal = cols; document.querySelectorAll('.sw').forEach(s=>s.classList.remove('active')); sw.classList.add('active'); };
  palsEl.appendChild(sw);
});

const opt = {spread:14, speed:6, fade:4};
const bind = (id,key,label)=>{
  const el = document.getElementById(id);
  el.oninput = ()=>{ opt[key]=+el.value; if(label) document.getElementById(label).textContent = el.value; };
};
bind('spread','spread','vSpread'); bind('speed','speed','vSpeed'); bind('fade','fade');

let mx = W/2, my = H/2, px = mx, py = my, active = false;
let t = 0;
window.addEventListener('mousemove', e=>{ mx=e.clientX; my=e.clientY; hideHint(); });
window.addEventListener('mousedown', ()=> active=true);
window.addEventListener('mouseup', ()=> active=false);
window.addEventListener('touchmove', e=>{ const p=e.touches[0]; mx=p.clientX; my=p.clientY; active=true; hideHint(); e.preventDefault(); }, {passive:false});
window.addEventListener('touchend', ()=> active=false);

let hintGone=false;
function hideHint(){ if(hintGone) return; hintGone=true; const h=document.getElementById('hint'); h.style.opacity=0; setTimeout(()=>h.remove(),700); }

function loop(){
  // fade trail
  if(opt.fade>0){ ctx.fillStyle = `rgba(11,12,20,${opt.fade/100})`; ctx.fillRect(0,0,W,H); }
  t += opt.speed*0.01;
  hueT += 0.3;

  // ease pointer toward mouse
  px += (mx-px)*0.12; py += (my-py)*0.12;

  // harmonograph offsets around the pointer
  const a = opt.spread*4;
  const x1 = px + Math.sin(t*1.3)*a*Math.exp(-t*0);
  const y1 = py + Math.cos(t*1.7)*a;
  const x2 = px + Math.sin(t*2.1+1)*a*0.6;
  const y2 = py + Math.cos(t*2.9+2)*a*0.6;

  const col = pal[Math.floor((hueT*0.05)%pal.length)];
  ctx.strokeStyle = col;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = active ? 2.2 : 1.1;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.quadraticCurveTo(px,py,x2,y2);
  ctx.stroke();

  // sparkle dot when actively pressing
  if(active){
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x1,y1, opt.spread*0.12+1, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(loop);
}
loop();

document.getElementById('clear').onclick = resize;
document.getElementById('save').onclick = ()=>{
  const a = document.createElement('a');
  a.download = 'harmonograph.png';
  a.href = c.toDataURL('image/png');
  a.click();
};
</script>
</body>
</html>
